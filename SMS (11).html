// Auto-generate student ID: e.g. LK2601, DC2807
// allStudents = active + left (to avoid duplicate numbers)
function genStudentId(cls, enrollDate, allStudents) {
  const code = CLASS_CODES[cls] || cls.replace(/[^A-Z0-9]/gi,"").slice(0,2).toUpperCase();
  const year = (enrollDate||new Date().toISOString().slice(0,10)).slice(2,4);
  const prefix = code + year;
  // Count existing students with same prefix
  const existing = allStudents.filter(s => s.studentId && s.studentId.startsWith(prefix));
  const num = existing.length + 1;
  return prefix + String(num).padStart(2,"0");
}

function n2w(n){
  const a=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
  const b=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
  if(!n||n===0)return"Zero";n=Math.floor(n);let s="";
  if(Math.floor(n/100000)>0){s+=a[Math.floor(n/100000)]+" Lakh ";n%=100000;}
  if(Math.floor(n/1000)>0){const t=Math.floor(n/1000);s+=(t<20?a[t]:b[Math.floor(t/10)]+(t%10?" "+a[t%10]:""))+" Thousand ";n%=1000;}
  if(Math.floor(n/100)>0){s+=a[Math.floor(n/100)]+" Hundred ";n%=100;}
  if(n>0){s+=n<20?a[n]:b[Math.floor(n/10)]+(n%10?" "+a[n%10]:"");}
  return s.trim()+" Rupees Only";
}

// Also caches in localStorage so the app works offline / on first load
// CSV helper — avoids all template literal / newline issues inside JSX
function makeCSV(rows){ return rows.map(r=>r.map(c=>'"'+(String(c||'').replace(/"/g,'""'))+'"').join(',')).join('\n'); }

function useLS(key, init) {
  const [v, sv] = useState(() => {
    try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : init; } catch { return init; }
  });
  const [synced, setSynced] = useState(false);

  // On mount: subscribe to Firebase path
  useEffect(() => {
    try {
      const ref = window.db ? window.db.ref('svn/' + key) : null;
      if (!ref) return;
      const handler = ref.on('value', snap => {
        // Firebase returns null for empty arrays — use sentinel '__empty__' to distinguish
        const raw = snap.val();
        const val = raw === '__empty__' ? (Array.isArray(init) ? [] : {}) : raw;
        const resolved = val !== null && val !== undefined ? val : (Array.isArray(init) ? [] : (typeof init === 'object' ? {} : init));
        sv(resolved);
        try { localStorage.setItem(key, JSON.stringify(resolved)); } catch {}
        setSynced(true);
      });
      return () => ref.off('value', handler);
    } catch(e) { setSynced(true); }
  }, [key]);

  // Write to Firebase whenever value changes (after initial sync)
  useEffect(() => {
    if (!synced) return;
    try { localStorage.setItem(key, JSON.stringify(v)); } catch {}
    try {
      if (window.db) {
        // Firebase can't store empty arrays — store a sentinel so other devices get the update
        const toStore = (Array.isArray(v) && v.length === 0) ? '__empty__' : v;
        window.db.ref('svn/' + key).set(toStore);
      }
    } catch(e) {}
  }, [v, key, synced]);

  return [v, sv];
}

function App() {
  const[auth,setAuth]=useState(()=>{try{const s=localStorage.getItem("svn-auth4");return s?JSON.parse(s):null;}catch{return null;}});
  const[tab,setTab]=useState("dashboard");
  const[pAuth,setPAuth]=useState(null);
  const[collapsed,setCollapsed]=useState(false);
  const[fbOnline,setFbOnline]=useState(false);
  const[capsLock,setCapsLock]=useLS("svn-caps4",false);
  // Expose capsLock globally so Input component can read it without prop drilling
  useEffect(()=>{window._capsLock=capsLock;},[capsLock]);
  // Apply developer theme
  useEffect(()=>{
    if(isDev){
      Object.assign(T, T_DEV);
      document.documentElement.style.setProperty('--dev-mode','1');
    } else {
      // Restore normal theme
      T.text="#f59e0b"; T.textMuted="#22c55e";
      document.documentElement.style.removeProperty('--dev-mode');
    }
  },[isDev]);


  // Firebase connection status
  useEffect(()=>{
    try{
      if(window.db){
        const ref=window.db.ref('.info/connected');
        ref.on('value',snap=>setFbOnline(!!snap.val()));
        return ()=>ref.off();
      }
    }catch(e){}
  },[]);

  const[students,setStudents]=useLS("svn-stu4",[]);
  const[payments,setPayments]=useLS("svn-pay4",[]);
  const[expenses,setExpenses]=useLS("svn-exp4",[]);
  const[salaries,setSalaries]=useLS("svn-sal4",[]);
  const[staff,setStaff]=useLS("svn-stf4",[]);
  const[att,setAtt]=useLS("svn-att4",{});
  const[satt,setSatt]=useLS("svn-satt4",{});
  const[scal,setScal]=useLS("svn-scal4",{});
  const[stcal,setStcal]=useLS("svn-stcal4",{});
  const[hw,setHw]=useLS("svn-hw4",[]);
  const[notifs,setNotifs]=useLS("svn-notifs4",{});
  const[extraCats,setExtraCats]=useLS("svn-xcats4",[]);
  const[extraSubcats,setExtraSubcats]=useLS("svn-xsubs4",{});
  const[exams,setExams]=useLS("svn-exams4",[]);
  const[messages,setMessages]=useLS("svn-msgs4",[]);
  const[banks,setBanks]=useLS("svn-banks4",[]);
  const[leftStudents,setLeftStudents]=useLS("svn-lefstu4",[]);
  const[leftStaff,setLeftStaff]=useLS("svn-lefstf4",[]);
  const[trash,setTrash]=useLS("svn-trash4",[]);

  const isAdmin = auth?.role==="admin";
  const isAcc = auth?.role==="accountant";
  const isStaff = auth?.role==="staff";
  const isDev = auth?.role==="developer";
  const canAdd = isAdmin||isAcc||isDev;
  const canEdit = isAdmin||isDev;
  const canDel = isAdmin||isDev;

  // Developer sandbox — stores new data only visible to dev, cleared on logout
  const[devStudents,setDevStudents]=useState([]);
  const[devPayments,setDevPayments]=useState([]);
  const[devExpenses,setDevExpenses]=useState([]);
  const[devSalaries,setDevSalaries]=useState([]);
  const[devStaff,setDevStaff]=useState([]);

  // Merge real + dev sandbox data for developer view
  const effStudents=isDev?[...students,...devStudents]:students;
  const effPayments=isDev?[...payments,...devPayments]:payments;
  const effExpenses=isDev?[...expenses,...devExpenses]:expenses;
  const effSalaries=isDev?[...salaries,...devSalaries]:salaries;
  const effStaff=isDev?[...staff,...devStaff]:staff;

  // Dev logout clears sandbox
  const logout=()=>{
    setAuth(null);
    localStorage.removeItem("svn-auth4");
    if(isDev){setDevStudents([]);setDevPayments([]);setDevExpenses([]);setDevSalaries([]);setDevStaff([]);}
  };
  // Staff can add/edit in homeworks, exams, messages
  const canAddHEM = isAdmin||isAcc||isStaff;
  const canEditHEM = isAdmin||isStaff;
  const canDelHEM = isAdmin;

  const doLogin=(u,p)=>{
    // Compare lowercase to handle caps mode
    const user=USERS.find(x=>x.u===u.toLowerCase()&&x.p===p.toLowerCase());
    if(user){const a={username:u.toLowerCase(),role:user.r};setAuth(a);localStorage.setItem("svn-auth4",JSON.stringify(a));window._loginMode=false;return true;}
    return false;
  };
  // logout defined above with dev sandbox clear
  const parentLogin=(name,email)=>{
    const s=students.find(st=>(st.fatherName?.toLowerCase()===name.toLowerCase()||st.motherName?.toLowerCase()===name.toLowerCase())&&st.parentEmail?.toLowerCase()===email.toLowerCase());
    if(s){setPAuth({name,studentId:s.id,studentName:s.name});return true;}return false;
  };
  const dismissN=(studentId,idx)=>setNotifs(p=>{const a=[...(p[studentId]||[])];a.splice(idx,1);return{...p,[studentId]:a};});

  if(pAuth) return <ParentPortal auth={pAuth} setAuth={setPAuth} students={students} payments={payments} att={att} notifs={notifs} dismissN={dismissN} scal={scal} hw={hw} exams={exams} messages={messages}/>;
  if(!auth) return <Login doLogin={doLogin} parentLogin={parentLogin}/>;

  // For developer: use sandbox setters so new data goes to sandbox not Firebase
  const pStudents=isDev?devStudents:students;
  const pPayments=isDev?devPayments:payments;
  const pExpenses=isDev?devExpenses:expenses;
  const pSalaries=isDev?devSalaries:salaries;
  const pStaff=isDev?devStaff:staff;
  const pSetStudents=isDev?setDevStudents:setStudents;
  const pSetPayments=isDev?setDevPayments:setPayments;
  const pSetExpenses=isDev?setDevExpenses:setExpenses;
  const pSetSalaries=isDev?setDevSalaries:setSalaries;
  const pSetStaff=isDev?setDevStaff:setStaff;

  const P={students:effStudents,setStudents:pSetStudents,payments:effPayments,setPayments:pSetPayments,expenses:effExpenses,setExpenses:pSetExpenses,salaries:effSalaries,setSalaries:pSetSalaries,staff:effStaff,setStaff:pSetStaff,att,setAtt,satt,setSatt,scal,setScal,stcal,setStcal,hw,setHw,notifs,setNotifs,canAdd,canEdit,canDel,isAdmin,isAcc,isStaff,canAddHEM,canEditHEM,canDelHEM,extraCats,setExtraCats,extraSubcats,setExtraSubcats,exams,setExams,messages,setMessages,capsLock,leftStudents,setLeftStudents,leftStaff,setLeftStaff,trash,setTrash,banks,setBanks};

  return (
    <div style={{display:"flex", minHeight:"100vh", background:T.bg}}>
      <Sidebar tab={tab} setTab={setTab} auth={auth} logout={logout} collapsed={collapsed} setCollapsed={setCollapsed} fbOnline={fbOnline} capsLock={capsLock} setCapsLock={setCapsLock} isDev={isDev}/>
      <main style={{flex:1, overflowX:"hidden"}}>
        <div style={{padding:"24px", maxWidth:1300, margin:"0 auto"}} className="fade-in">
          {tab==="dashboard" && <Dashboard {...P}/>}
          {tab==="students" && <Students {...P}/>}
          {tab==="enrollment" && <Enrollment {...P}/>}
          {tab==="payments" && <Payments {...P}/>}
          {tab==="expenses" && <Expenses {...P}/>}
          {tab==="receipts" && <Receipts {...P}/>}
          {tab==="salaries" && <Salaries {...P}/>}
          {tab==="stuAtt" && <StuAtt {...P}/>}
          {tab==="staffAtt" && <StaffAtt {...P}/>}
          {tab==="staffEnroll" && <StaffEnroll {...P}/>}
          {tab==="staffList" && <StaffList {...P}/>}
          {tab==="homeworks" && <Homeworks {...P}/>}
          {tab==="calendar" && <CalMod {...P}/> }
          {tab==="stock" && <Stock {...P}/>}
          {tab==="exams" && <Exams {...P}/>}
          {tab==="messages" && <Messages {...P}/>}
          {tab==="savedData" && <SavedData {...P}/>}
          {tab==="trash" && <TrashTab {...P}/>}
        </div>
      </main>
    </div>
  );
}

// ── LOGIN ─────────────────────────────────────────────────────────────────────
function Login({doLogin, parentLogin}) {
  const[mode,setMode]=useState("staff");
  const[u,setU]=useState(""),[ p,setP]=useState("");
  const[pn,setPN]=useState(""),[ pe,setPE]=useState("");
  const[err,setErr]=useState("");
  const go=()=>{
    if(mode==="staff"){if(!doLogin(u,p))setErr("Invalid credentials");}
    else{if(!parentLogin(pn,pe))setErr("No student found. Check name & email.");}
  };
  return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:T.bg}}>
      <div style={{width:400,background:T.surface,border:`1px solid ${T.border}`,borderRadius:16,padding:"40px 36px",boxShadow:"0 24px 64px rgba(0,0,0,0.5)"}}>
        <div style={{textAlign:"center",marginBottom:28}}>
          <img src={LOGO_URI} style={{width:80,height:80,borderRadius:12,objectFit:"contain",marginBottom:14}} alt="logo"/>
          <h1 style={{fontSize:20,fontWeight:700,color:T.text,margin:0}}>{SN}</h1>
          <p style={{color:T.textMuted,fontSize:14,marginTop:6}}>School Management System</p>
        </div>
        <div style={{display:"flex",gap:6,marginBottom:20,background:T.surface2,padding:4,borderRadius:10}}>
          {["staff","parent"].map(m=>(
            <button key={m} onClick={()=>{setMode(m);setErr("");}} style={{flex:1,padding:"8px",border:"none",borderRadius:8,background:mode===m?T.accent:"transparent",color:mode===m?"#fff":T.textMuted,cursor:"pointer",fontSize:15,fontWeight:mode===m?600:400,transition:"all 0.2s"}}>
              {m==="staff"?"Staff / Admin":"Parent"}
            </button>
          ))}
        </div>
        {mode==="staff"
          ? <>
              <Input label="Username" value={u} onChange={e=>setU(e.target.value)} fullWidth style={{marginBottom:12}}/>
              <Input label="Password" type="password" value={p} onChange={e=>setP(e.target.value)} fullWidth/>
            </>
          : <>
              <Input label="Your Name (Father / Mother)" value={pn} onChange={e=>setPN(e.target.value)} fullWidth style={{marginBottom:12}}/>
              <Input label="Gmail Address" value={pe} onChange={e=>setPE(e.target.value)} fullWidth/>
            </>
        }
        {err && <div style={{color:T.red,fontSize:14,marginTop:8,background:T.red+"15",padding:"6px 10px",borderRadius:6}}>{err}</div>}
        <Btn onClick={go} style={{width:"100%",justifyContent:"center",marginTop:16,padding:"11px"}}>Login →</Btn>

      </div>
    </div>
  );
}

// ── DASHBOARD ─────────────────────────────────────────────────────────────────
function Dashboard({students,payments,expenses,salaries}) {
  const inc = payments.reduce((s,p)=>s+Number(p.amount||0),0);
  const exp = expenses.reduce((s,e)=>s+Number(e.amount||0),0);
  const sal = salaries.reduce((s,x)=>s+Number(x.netSalary||0),0);
  const bal = inc-exp-sal;
  const now = new Date();
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const md = months.map((m,i)=>{
    const y=now.getFullYear();
    const gi=payments.filter(p=>{const d=new Date(p.date);return d.getMonth()===i&&d.getFullYear()===y;}).reduce((s,p)=>s+Number(p.amount||0),0);
    const ge=expenses.filter(e=>{const d=new Date(e.date);return d.getMonth()===i&&d.getFullYear()===y;}).reduce((s,e)=>s+Number(e.amount||0),0);
    const gs=salaries.filter(s=>{const d=new Date(s.date);return d.getMonth()===i&&d.getFullYear()===y;}).reduce((s,x)=>s+Number(x.netSalary||0),0);
    return{m,i:gi,e:ge+gs};
  });
  const maxV = Math.max(...md.flatMap(d=>[d.i,d.e]),1);
  const expCSV=()=>{
    const rows=[["Month","Income","Expenses+Salaries","Balance"],...md.map(d=>[d.m,d.i,d.e,d.i-d.e])];
    const csv=rows.map(r=>r.join(",")).join("\n");
    const b=new Blob([csv],{type:"text/csv"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="dashboard.csv";a.click();
  };
  return(
    <div>
      <PageHeader title="Dashboard" subtitle={`Academic Year ${now.getFullYear()}`} actions={
        <Btn onClick={expCSV} variant="secondary">⬇ Export CSV</Btn>
      }/>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:14,marginBottom:24}}>
        <StatCard icon="💰" label="Total Income" value={`₹${inc.toLocaleString()}`} color={T.green}/>
        <StatCard icon="📤" label="Total Expenses" value={`₹${exp.toLocaleString()}`} color={T.red}/>
        <StatCard icon="👔" label="Salaries Paid" value={`₹${sal.toLocaleString()}`} color={T.amber}/>
        <StatCard icon="🏦" label="Net Balance" value={`₹${bal.toLocaleString()}`} color={bal>=0?T.accent:T.red}/>
        <StatCard icon="🎓" label="Total Students" value={students.length} color={T.purple}/>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:14}}>
        <GlassCard style={{padding:20}}>
          <h3 style={{fontSize:16,fontWeight:600,color:T.text,marginBottom:16}}>Monthly Income vs Expenses — {now.getFullYear()}</h3>
          <div style={{overflowX:"auto"}}>
            <svg width="100%" viewBox="0 0 620 200" style={{minWidth:500,display:"block"}}>
              {[0,25,50,75,100].map(pct=>{
                const y=14+(100-pct)*1.52;const val=Math.round(maxV*pct/100);
                return(<g key={pct}>
                  <line x1="40" y1={y} x2="610" y2={y} stroke={T.border} strokeWidth="1"/>
                  <text x="36" y={y+4} textAnchor="end" fontSize="8" fill={T.textMuted}>{val>=1000?`${Math.round(val/1000)}k`:val}</text>
                </g>);
              })}
              {md.map((d,i)=>{
                const x=48+i*48;const ih=(d.i/maxV)*130;const eh=(d.e/maxV)*130;
                return(<g key={i}>
                  <rect x={x} y={166-ih} width="16" height={ih} fill={T.green} rx="3" opacity="0.85"/>
                  {d.i>0&&<text x={x+8} y={161-ih} textAnchor="middle" fontSize="7" fill={T.green}>{d.i>=1000?`${Math.round(d.i/1000)}k`:d.i}</text>}
                  <rect x={x+18} y={166-eh} width="16" height={eh} fill={T.red} rx="3" opacity="0.85"/>
                  {d.e>0&&<text x={x+26} y={161-eh} textAnchor="middle" fontSize="7" fill={T.red}>{d.e>=1000?`${Math.round(d.e/1000)}k`:d.e}</text>}

  const[q,setQ]=useState("");
  const active=students.filter(s=>!s.leftDate);
  const filt=active.filter(s=>[s.name,s.studentId,s.class,s.fatherName,s.motherName].some(x=>x?.toLowerCase().includes(q.toLowerCase())));
  const[markLeftId,setMarkLeftId]=useState(null);
  const[leftReason,setLeftReason]=useState("");
  const[editStu,setEditStu]=useState(null); // student being edited

  const saveEditStu=()=>{
    if(!editData.name)return alert("Name is required");
    setStudents(p=>p.map(s=>s.id===editStu?{...s,...editData}:s));

  };

  const markLeft=()=>{
    const s=students.find(x=>x.id===markLeftId);

    const leftEntry={...s,leftDate:td(),leftReason};

function Enrollment({students,setStudents,payments,canAdd,canEdit,canDel,leftStudents}) {
  const allStudents=[...students,...(leftStudents||[])];
  const blank={name:"",studentId:"",class:"",totalFee:"",fatherName:"",motherName:"",guardianName:"",mobile1:"",mobile2:"",address:"",emergencyContact:"",dateOfEnrollment:td(),parentEmail:"",apparId:"",penId:""};
  const[f,setF]=useState(blank);
  const[saved,setSaved]=useState(null);
  const[editId,setEditId]=useState(null);

  const ff=(key,val)=>setF(p=>{
    const updated={...p,[key]:val};
    if((key==="class"||key==="dateOfEnrollment")&&!editId){
      const cls=key==="class"?val:(p.class||"");
      const dt=key==="dateOfEnrollment"?val:(p.dateOfEnrollment||td());
      if(cls) updated.studentId=genStudentId(cls,dt,[...students,...(leftStudents||[])]);
    }
    return updated;
  });

  const save=()=>{
            // Ensure ID — auto-generate if somehow missing
    const finalId=f.studentId||genStudentId(f.class,f.dateOfEnrollment,allStudents);
    if(!f.mobile1)return alert("Mobile 1 is mandatory");
    if(editId){
      setStudents(p=>p.map(s=>s.id===editId?{...s,...f,studentId:finalId}:s));

    } else {

            <div>
              <label style={{fontSize:13,color:T.green,fontWeight:600,display:"block",marginBottom:4}}>Student ID 🔒 (auto-generated)</label>

            <div style={{fontSize:15,fontWeight:600,color:T.text,marginBottom:12}}>Recent Enrollments</div>

function Payments({students,payments,setPayments,canAdd,canEdit,canDel,extraCats,setExtraCats,extraSubcats,setExtraSubcats,banks,setBanks}) {
  const[q,setQ]=useState(""),[ show,setShow]=useState(false),[ eid,setEid]=useState(null);
  const[catFilter,setCatFilter]=useState("All");
  const blank={studentId:"",date:td(),amount:"",method:"Cash",referenceId:"",category:"Tuition Fee",subCategory:"",parentName:"",parentRelation:"Father",description:"",fromBank:"",fromBankAcc:"",toBank:"",toBankAcc:"",totalFeeAmt:"",discountPct:"",feeReduced:0,payableFee:0};
  const[f,setF]=useState(blank);
  const[newCat,setNewCat]=useState("");
  const[newSub,setNewSub]=useState("");
  const[showCatAdd,setShowCatAdd]=useState(false);
  const[segregation,setSegregation]=useState("category"); // "category" | "bank"

  const allFeeCats=[...FEE_CATS,...(extraCats||[]).filter(c=>c.startsWith("FEE:")).map(c=>c.slice(4))];
  const getFeeSubs=cat=>[...(FEE_SUBCATS[cat]||[]),...((extraSubcats||{})["FEE:"+cat]||[])];

  const filt=payments.filter(p=>{
    const s=students.find(st=>st.id===p.studentId);
    const matchQ=[p.description,p.notes,p.referenceId,p.parentName,p.category,p.subCategory,s?.name,s?.studentId].some(x=>x?.toLowerCase().includes(q.toLowerCase()));
    const matchCat=catFilter==="All"||p.category===catFilter;
    return matchQ&&matchCat;
  });

  const save=()=>{
                    if(eid)setPayments(p=>p.map(x=>x.id===eid?{...x,...f}:x));

  const addCat=()=>{

      {show&&canAdd&&(

            <Input label="Method" value={f.method} onChange={e=>setF(p=>({...p,method:e.target.value}))} options={PMETHODS} fullWidth/>
            <Input label="Reference ID" value={f.referenceId} onChange={e=>setF(p=>({...p,referenceId:e.target.value}))} fullWidth/>

            </div>
            <div>
              <label style={{fontSize:13,color:T.textMuted,fontWeight:500,display:"block",marginBottom:4}}>Category *</label>

                    <Btn onClick={addCat} sm>Add</Btn>

                :<button onClick={()=>setShowCatAdd(true)} style={{fontSize:13,color:"#e67e00",background:"none",border:"none",cursor:"pointer",padding:0}}>+ Add new category</button>

            </div>

              <label style={{fontSize:13,color:T.textMuted,fontWeight:500,display:"block",marginBottom:4}}>Sub Category</label>
              <select value={f.subCategory} onChange={e=>setF(p=>({...p,subCategory:e.target.value}))} style={{background:T.surface2,border:`1px solid ${T.border}`,borderRadius:8,padding:"9px 12px",color:T.text,fontSize:15,width:"100%",outline:"none",marginBottom:6}}>
                <option value="">— None —</option>

              <div style={{display:"flex",gap:6}}>
                <input value={newSub} onChange={e=>setNewSub(e.target.value)} placeholder="+ Add new sub category" style={{background:T.surface2,border:`1px solid ${T.border}`,borderRadius:6,padding:"6px 10px",color:T.text,fontSize:14,flex:1,outline:"none"}}/>
                <Btn onClick={addSub} sm>Add</Btn>
              </div>
            </div>
            <div style={{gridColumn:"1/-1"}}>
              <div style={{background:T.surface2,borderRadius:10,padding:14,marginBottom:4}}>
                <div style={{fontSize:14,fontWeight:600,color:T.textMuted,marginBottom:10}}>🏷️ Discount Calculator (optional)</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:10,marginBottom:10}}>
                  <div>
                    <label style={{fontSize:13,color:T.textMuted,fontWeight:500,display:"block",marginBottom:4}}>Total Fee (₹)</label>
                    <input type="number" value={f.totalFeeAmt||""} onChange={e=>{
                      const total=Number(e.target.value||0);

                      const payable=total-reduced;

                      const pct=Number(e.target.value||0);
                      const total=Number(f.totalFeeAmt||0);
                      const reduced=Math.round(total*pct/100);
                      const payable=total-reduced;
                      setF(p=>({...p,discountPct:e.target.value,feeReduced:reduced,payableFee:payable,amount:payable||p.amount}));
                    }} placeholder="e.g. 10" min="0" max="100" style={{background:T.surface,border:`1px solid ${T.border}`,borderRadius:8,padding:"9px 12px",color:T.text,fontSize:15,width:"100%",outline:"none"}}/>
                  </div>
                  <div>
                    <label style={{fontSize:13,color:T.green,fontWeight:600,display:"block",marginBottom:4}}>Fee Reduced 🔒</label>
                    <div style={{background:T.green+"11",border:`1px solid ${T.green}33`,borderRadius:8,padding:"9px 12px",color:T.green,fontSize:16,fontWeight:700}}>₹{Number(f.feeReduced||0).toLocaleString()}</div>
                  </div>
                  <div>
                    <label style={{fontSize:13,color:"#e67e00",fontWeight:600,display:"block",marginBottom:4}}>Payable Fee 🔒</label>
                    <div style={{background:T.amber+"11",border:`1px solid ${T.accent}33`,borderRadius:8,padding:"9px 12px",color:"#e67e00",fontSize:16,fontWeight:700}}>₹{Number(f.payableFee||0).toLocaleString()}</div>
                  </div>
                </div>
                {(f.discountPct>0&&f.totalFeeAmt>0)&&<div style={{fontSize:13,color:T.green,fontWeight:500}}>✅ Amount field auto-filled with payable fee. You can still override it below.</div>}

            <div style={{gridColumn:"1/-1"}}>
              <Input label="Description *" value={f.description} onChange={e=>setF(p=>({...p,description:e.target.value}))} fullWidth placeholder="e.g. 1st Term Fee + Admission"/>
            </div>
            <BankSelect label="From Bank (payer's bank)" value={f.fromBank} accountValue={f.fromBankAcc} onChange={v=>setF(p=>({...p,fromBank:v}))} onAccountChange={v=>setF(p=>({...p,fromBankAcc:v}))} banks={banks} setBanks={setBanks}/>
            <BankSelect label="To Bank (received into)" value={f.toBank} accountValue={f.toBankAcc} onChange={v=>setF(p=>({...p,toBank:v}))} onAccountChange={v=>setF(p=>({...p,toBankAcc:v}))} banks={banks} setBanks={setBanks}/>
          </FormGrid>
          <div style={{display:"flex",gap:8,marginTop:16}}>
            <Btn onClick={save}>Save Payment</Btn>
            <Btn onClick={()=>{setShow(false);setEid(null);}} variant="secondary">Cancel</Btn>
          </div>
        </GlassCard>
      )}
      <GlassCard>
        <Tbl>
          {segregation==="category"&&<thead><tr><TH>Date</TH><TH>Student</TH><TH>Category</TH><TH>Sub Cat.</TH><TH>Amount</TH><TH>Method</TH><TH>From Bank</TH><TH>To Bank</TH><TH>Description</TH><TH>Actions</TH></tr></thead>}
          <tbody>
            {segregation==="category"&&filt.length===0&&<tr><td colSpan={10} style={{padding:24,textAlign:"center",color:T.textMuted}}>No payments</td></tr>}
            {segregation==="category"&&filt.map(pay=>{const st=students.find(s=>s.id===pay.studentId);return(<tr key={pay.id}>
              <TD style={{color:T.textMuted,whiteSpace:"nowrap"}}>{fD(pay.date)}</TD>
              <TD><div style={{fontWeight:600}}>{st?.name||"?"}</div><div style={{fontSize:13,color:T.textMuted}}>{st?.studentId}</div></TD>
              <TD><Badge color={T.accent}>{pay.category}</Badge></TD>
              <TD style={{color:T.textMuted,fontSize:14}}>{pay.subCategory||"—"}</TD>
              <TD style={{color:T.green,fontWeight:700}}>₹{Number(pay.amount||0).toLocaleString()}</TD>
              <TD><Badge>{pay.method}</Badge></TD>
              <TD><div style={{fontWeight:500,fontSize:14}}>{pay.fromBank||"—"}</div><div style={{fontSize:12,color:T.textMuted}}>{pay.fromBankAcc}</div></TD>
              <TD><div style={{fontWeight:500,fontSize:14}}>{pay.toBank||"—"}</div><div style={{fontSize:12,color:T.textMuted}}>{pay.toBankAcc}</div></TD>
              <TD style={{color:T.textMuted,fontSize:14}}>
                {pay.description||pay.notes}
                {pay.discountPct>0&&<div style={{fontSize:12,color:T.green,marginTop:2}}>🏷️ {pay.discountPct}% discount · saved ₹{Number(pay.feeReduced||0).toLocaleString()}</div>}
              </TD>
              <TD><div style={{display:"flex",gap:6}}>
                {canEdit&&<Btn onClick={()=>{setF({...pay,description:pay.description||pay.notes||""});setEid(pay.id);setShow(true);}} variant="ghost" sm>Edit</Btn>}
                {canDel&&<Btn onClick={()=>del(pay.id)} variant="danger" sm>Del</Btn>}
              </div></TD>
            </tr>);})}
          </tbody>
        </Tbl>
      </GlassCard>
    </div>
  );
}

// ── EXPENSES ─────────────────────────────────────────────────────────────────
function Expenses({expenses,setExpenses,canAdd,canEdit,canDel,extraCats,setExtraCats,extraSubcats,setExtraSubcats,banks,setBanks}) {
  const[q,setQ]=useState("");
  const[catFilter,setCatFilter]=useState("All");
  const[show,setShow]=useState(false);
  const[eid,setEid]=useState(null);
  const blank={date:td(),category:"Stationary",subCategory:"",vendorName:"",amount:"",notes:"",quantity:1,unit:"",fromBank:"",fromBankAcc:"",toBank:"",toBankAcc:""};
  const[f,setF]=useState(blank);
  const[showAddCat,setShowAddCat]=useState(false);
  const[newCat,setNewCat]=useState("");
  const[showAddSub,setShowAddSub]=useState(false);
  const[newSub,setNewSub]=useState("");

  const[segregation,setSegregation]=useState("category");
  const allCats = [...ECATS, ...(extraCats||[])];
  const getAllSubs = cat => [...(SUBCATS[cat]||[]), ...((extraSubcats||{})[cat]||[])];
  const currentSubs = getAllSubs(f.category);

  const filt=expenses.filter(e=>{
    const matchQ=[e.category,e.subCategory,e.vendorName,e.notes].some(x=>x?.toLowerCase().includes(q.toLowerCase()));
    const matchCat=catFilter==="All"||e.category===catFilter;
    return matchQ&&matchCat;
  });

  const save=()=>{
        const entry={...f,id:eid||Date.now().toString()};
    if(eid)setExpenses(p=>p.map(e=>e.id===eid?entry:e));
    else setExpenses(p=>[...p,entry]);
    setShow(false);setEid(null);setF(blank);
  };
  const del=id=>{if(window.confirm("Delete?"))setExpenses(p=>p.filter(e=>e.id!==id));};

  const addCat=()=>{
    if(!newCat.trim())return;
    setExtraCats(p=>[...(p||[]),newCat.trim()]);
    setF(prev=>({...prev,category:newCat.trim()}));
    setNewCat("");setShowAddCat(false);
  };
  const addSub=()=>{
    if(!newSub.trim())return;
    setExtraSubcats(p=>({...(p||{}),[f.category]:[...((p||{})[f.category]||[]),newSub.trim()]}));
    setF(prev=>({...prev,subCategory:newSub.trim()}));
    setNewSub("");setShowAddSub(false);
  };

  const expCSV=()=>{
    const rows=[["Date","Category","Sub-Category","Vendor","Quantity","Unit","Amount","Notes"],...expenses.map(e=>[fD(e.date),e.category,e.subCategory||"",e.vendorName,e.quantity||1,e.unit||"",e.amount,e.notes])];
    const csv=makeCSV(rows);
    const b=new Blob([csv],{type:"text/csv"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="expenses.csv";a.click();
  };

  return(
    <div>
      <PageHeader title="Expenses" subtitle={`${filt.length} records`} actions={
        <>
          <Input placeholder="Search expenses..." value={q} onChange={e=>setQ(e.target.value)} style={{width:200}}/>
          <Btn onClick={expCSV} variant="secondary">⬇ Export</Btn>
          {canAdd&&<Btn onClick={()=>{setF(blank);setEid(null);setShow(true);}}>+ Add Expense</Btn>}
        </>
      }/>

      {/* Category filter chips */}
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:16}}>
        {["All",...allCats].map(cat=>(
          <button key={cat} onClick={()=>setCatFilter(cat)} style={{padding:"5px 12px",borderRadius:99,border:`1px solid ${catFilter===cat?T.accent:T.border}`,background:catFilter===cat?T.amber+"22":"transparent",color:catFilter===cat?T.accent:T.textMuted,cursor:"pointer",fontSize:14,fontWeight:catFilter===cat?600:400,whiteSpace:"nowrap"}}>
            {cat}
          </button>
        ))}
      </div>

      {show&&canAdd&&(
        <GlassCard style={{padding:24,marginBottom:16}}>
          <h3 style={{fontSize:17,fontWeight:600,color:T.text,marginBottom:16}}>{eid?"Edit":"Add"} Expense</h3>
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            {/* Row 1: Date, Vendor, Amount, Qty, Unit */}
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:12}}>
              <Input label="Date" type="date" value={f.date} onChange={e=>setF(p=>({...p,date:e.target.value}))} fullWidth/>
              <Input label="Vendor Name" value={f.vendorName} onChange={e=>setF(p=>({...p,vendorName:e.target.value}))} fullWidth/>
              <Input label="Amount (₹)" type="number" value={f.amount} onChange={e=>setF(p=>({...p,amount:e.target.value}))} fullWidth/>
              <Input label="Quantity" type="number" value={f.quantity||1} onChange={e=>setF(p=>({...p,quantity:e.target.value}))} fullWidth/>
              <Input label="Unit (e.g. pcs, kg, box)" value={f.unit||""} onChange={e=>setF(p=>({...p,unit:e.target.value}))} fullWidth/>
            </div>
            {/* Row 2: Category + SubCategory — each gets half width, never squashed */}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
              <div>
                <label style={{fontSize:13,color:T.textMuted,fontWeight:500,display:"block",marginBottom:4}}>Category</label>
                <div style={{display:"flex",gap:6,alignItems:"center"}}>
                  <select value={f.category} onChange={e=>setF(p=>({...p,category:e.target.value,subCategory:""}))} style={{background:T.surface2,border:`1px solid ${T.border}`,borderRadius:8,padding:"9px 12px",color:T.text,fontSize:15,flex:1,minWidth:0,outline:"none"}}>
                    {allCats.map(c=><option key={c}>{c}</option>)}
                  </select>
                  <button onClick={()=>{setShowAddCat(!showAddCat);setShowAddSub(false);}} title="Add new category" style={{background:T.amber+"22",border:`1px solid ${T.accent}44`,color:"#e67e00",borderRadius:8,width:34,height:38,cursor:"pointer",fontSize:20,fontWeight:700,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>+</button>
                </div>
                {showAddCat&&(
                  <div style={{display:"flex",gap:6,marginTop:6}}>
                    <input value={newCat} onChange={e=>setNewCat(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addCat()} placeholder="New category name" style={{background:T.surface2,border:`1px solid ${T.amber}`,borderRadius:8,padding:"7px 10px",color:T.text,fontSize:14,flex:1,outline:"none"}}/>
                    <button onClick={addCat} style={{background:T.green+"22",color:T.green,border:`1px solid ${T.green}44`,borderRadius:8,padding:"0 12px",cursor:"pointer",fontSize:14,fontWeight:600,flexShrink:0}}>Add</button>
                    <button onClick={()=>setShowAddCat(false)} style={{background:"transparent",color:T.textMuted,border:`1px solid ${T.border}`,borderRadius:8,padding:"0 10px",cursor:"pointer",fontSize:14,flexShrink:0}}>✕</button>
                  </div>
                )}
              </div>
              <div>
                <label style={{fontSize:13,color:T.textMuted,fontWeight:500,display:"block",marginBottom:4}}>Sub-Category</label>
                <div style={{display:"flex",gap:6,alignItems:"center"}}>

            <BankSelect label="From Bank (paid from)" value={f.fromBank} accountValue={f.fromBankAcc} onChange={v=>setF(p=>({...p,fromBank:v}))} onAccountChange={v=>setF(p=>({...p,fromBankAcc:v}))} banks={banks} setBanks={setBanks}/>
            <BankSelect label="To Bank (paid to / vendor)" value={f.toBank} accountValue={f.toBankAcc} onChange={v=>setF(p=>({...p,toBank:v}))} onAccountChange={v=>setF(p=>({...p,toBankAcc:v}))} banks={banks} setBanks={setBanks}/>

            <Btn onClick={save}>Save</Btn>
            <Btn onClick={()=>{setShow(false);setEid(null);}} variant="secondary">Cancel</Btn>
          </div>
        </GlassCard>
      )}

      {/* Segregation toggle */}
      <div style={{display:"flex",gap:8,marginBottom:12,alignItems:"center"}}>
        <span style={{fontSize:13,color:T.textMuted,fontWeight:500}}>View by:</span>
        {[["category","📂 Category"],["bank","🏦 Bank"]].map(([id,label])=>(
          <button key={id} onClick={()=>setSegregation(id)} style={{padding:"5px 14px",borderRadius:99,border:`1px solid ${segregation===id?T.accent:T.border}`,background:segregation===id?T.amber+"22":"transparent",color:segregation===id?T.accent:T.textMuted,fontSize:14,cursor:"pointer",fontWeight:segregation===id?600:400}}>{label}</button>
        ))}
      </div>
      {/* Bank-wise view */}
      {segregation==="bank"&&(()=>{
        const inflow=expenses.reduce((acc,e)=>{const k=e.toBank||"Unspecified";acc[k]=(acc[k]||0)+Number(e.amount||0);return acc;},{});
        const outflow=expenses.reduce((acc,e)=>{const k=e.fromBank||"Unspecified";acc[k]=(acc[k]||0)+Number(e.amount||0);return acc;},{});
        const allKeys=[...new Set([...Object.keys(inflow),...Object.keys(outflow)])];
        return(

                <GlassCard key={bank} style={{padding:16}}>
                  <div style={{fontWeight:700,fontSize:16,color:T.text,marginBottom:10}}>🏦 {bank}</div>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
                    <span style={{fontSize:14,color:T.textMuted}}>Paid To</span>

                  <div style={{display:"flex",justifyContent:"space-between"}}>

            <GlassCard>
              <Tbl>
                <thead><tr><TH>Date</TH><TH>Category</TH><TH>Vendor</TH><TH>Amount</TH><TH>From Bank</TH><TH>To Bank</TH></tr></thead>

                  {expenses.filter(e=>e.fromBank||e.toBank).map((e,i)=>(
                    <tr key={i}>

                      <TD><Badge color={T.amber}>{e.category}</Badge></TD>

        <Tbl>
          <thead><tr><TH>Date</TH><TH>Category</TH><TH>Sub-Category</TH><TH>Vendor</TH><TH>Qty</TH><TH>Unit</TH><TH>Amount</TH><TH>From Bank</TH><TH>To Bank</TH><TH>Description</TH><TH>Actions</TH></tr></thead>
          <tbody>
            {filt.length===0&&<tr><td colSpan={11} style={{padding:24,textAlign:"center",color:T.textMuted}}>No expenses found</td></tr>}
            {filt.map(e=><tr key={e.id}>
              <TD style={{color:T.textMuted,whiteSpace:"nowrap"}}>{fD(e.date)}</TD>
              <TD><Badge color={T.amber}>{e.category}</Badge></TD>
              <TD style={{color:T.textMuted}}>{e.subCategory}</TD>
              <TD>{e.vendorName}</TD>
              <TD style={{color:T.text}}>{e.quantity||1}</TD>
              <TD style={{color:T.textMuted}}>{e.unit}</TD>

              <TD><div style={{fontWeight:500,fontSize:14}}>{e.fromBank||"—"}</div><div style={{fontSize:12,color:T.textMuted}}>{e.fromBankAcc}</div></TD>
              <TD><div style={{fontWeight:500,fontSize:14}}>{e.toBank||"—"}</div><div style={{fontSize:12,color:T.textMuted}}>{e.toBankAcc}</div></TD>

      </GlassCard>
    </div>
  );
}

// ── RECEIPTS ─────────────────────────────────────────────────────────────────
function Receipts({students,payments}) {
  const[q,setQ]=useState("");
  const filt=payments.filter(p=>{const s=students.find(st=>st.id===p.studentId);return[s?.name,s?.studentId,p.notes].some(x=>x?.toLowerCase().includes(q.toLowerCase()));});
  const printR=pay=>{
    const st=students.find(s=>s.id===pay.studentId);if(!st)return;
    const totalPaid=payments.filter(p=>p.studentId===pay.studentId).reduce((t,p)=>t+Number(p.amount||0),0);
    const discountAmt=Number(pay.feeReduced||0);
    const totalFee=Number(st.totalFee||0);
    const due=Math.max(0,totalFee-totalPaid-discountAmt);
    const rNo="SVN-"+pay.id.slice(-6).toUpperCase();
    const parentLabel=pay.parentRelation||"Father";
    const parentName=pay.parentName||st.fatherName||"-";
    const copy=label=>"<div class='copy'><div class='copy-lbl'>"+label+"</div>"+hdrHTML+
    "<div class='doc-title2'>FEE RECEIPT</div>"+
    "<div class='row2'><span><b>Receipt No:</b> "+rNo+"</span><span><b>Date:</b> "+fD(pay.date)+"</span></div>"+
    "<hr class='divider'/>"+
    "<div class='row2'><span><b>Student:</b> "+st.name+"</span><span><b>Class:</b> "+(st.class||"-")+"</span></div>"+
    "<div class='row2'><span><b>Student ID:</b> "+st.studentId+"</span><span><b>"+parentLabel+":</b> "+parentName+"</span></div>"+
    "<hr class='divider'/>"+
    "<table class='data'><tr><th>Fee Item</th><th>Category</th><th>Method</th><th>Ref ID</th><th>Amount</th></tr>"+
    "<tr><td>"+(pay.description||pay.notes||"-")+"</td><td>"+(pay.category||"-")+"</td><td>"+pay.method+"</td><td>"+(pay.referenceId||"-")+"</td><td style='text-align:right;font-weight:700'>₹"+Number(pay.amount||0).toLocaleString()+"</td></tr></table>"+
    "<hr class='divider'/>"+
    (discountAmt>0?"<div class='row2'><span><b>Original Fee:</b> ₹"+Number(pay.totalFeeAmt||0).toLocaleString()+"</span><span class='grn'><b>Discount ("+(pay.discountPct||0)+")%:</b> −₹"+discountAmt.toLocaleString()+"</span></div>":"")+
    "<div class='row2'><span><b>Total Fee:</b> ₹"+totalFee.toLocaleString()+"</span><span class='grn'><b>Total Paid:</b> ₹"+totalPaid.toLocaleString()+"</span></div>"+
    "<div><span class='red'><b>Due Amount:</b> ₹"+due.toLocaleString()+"</span></div>"+
    "<div class='words'>Amount in Words: "+n2w(Number(pay.amount||0))+"</div>"+
    "<div class='spacer'></div>"+
    "<div class='footer'>This is a computer generated receipt. Signature is not required.<br/>"+SN+" · "+SA+"</div></div>";
    printDoc("Fee Receipt", copy("Administration Copy")+copy("Parent Copy"));
  };
  return(
    <div>
      <PageHeader title="Fee Receipts" actions={<Input placeholder="Search..." value={q} onChange={e=>setQ(e.target.value)} style={{width:220}}/>}/>
      <GlassCard>
        <Tbl>
          <thead><tr><TH>Date</TH><TH>Student</TH><TH>Class</TH><TH>Amount</TH><TH>Method</TH><TH>Description</TH><TH>Print</TH></tr></thead>
          <tbody>
            {filt.length===0&&<tr><td colSpan={7} style={{padding:24,textAlign:"center",color:T.textMuted}}>No payments. Add payments first.</td></tr>}
            {filt.map(pay=>{const st=students.find(s=>s.id===pay.studentId);return(<tr key={pay.id}>
              <TD style={{color:T.textMuted}}>{fD(pay.date)}</TD>
              <TD style={{fontWeight:600}}>{st?.name||"?"}</TD>
              <TD>{st?.class}</TD>
              <TD style={{color:T.green,fontWeight:700}}>₹{Number(pay.amount||0).toLocaleString()}</TD>
              <TD><Badge>{pay.method}</Badge></TD>
              <TD>{pay.notes}</TD>
              <TD><Btn onClick={()=>printR(pay)} variant="success" sm>🖨 Print</Btn></TD>
            </tr>);})}
          </tbody>
        </Tbl>
      </GlassCard>
    </div>
  );
}

// ── SALARIES ─────────────────────────────────────────────────────────────────
function Salaries({salaries,setSalaries,staff,satt,stcal,canAdd,canEdit,canDel,banks,setBanks}) {
  const[mode,setMode]=useState("records"); // "records" | "payroll" | "staffHistory"
  const[q,setQ]=useState(""),[ show,setShow]=useState(false),[ eid,setEid]=useState(null);
  const[historyStaff,setHistoryStaff]=useState("");
  // Payroll generator state
  const[payMonth,setPayMonth]=useState(()=>{const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;});
  const[payrollRows,setPayrollRows]=useState([]);
  const[payrollGenerated,setPayrollGenerated]=useState(false);

  const blank={staffName:"",staffId:"",date:td(),designation:"",employeeId:"",fromBank:"",fromBankAcc:"",toBank:"",toBankAcc:"",
    grossSalary:0,daysInMonth:30,absentDays:0,
    accCLs:0,clApplied:0,noOfLates:0,permissionMins:0,clsDueToPermLate:0,netAccCLs:0,
    llpDays:0,llpAmount:0,otDays:0,otAmount:0,
    esiAmount:0,otherDed:0,advanceSalary:0,paymentMode:"Bank",
    netPay:0,manualNetPay:false,
    basicPay:0,da:0,ada:0,hra:0,childrenEdu:0,specialAllowance:0,transportAllowance:0,
    ptDeduction:0,tf:0,
    notes:""};
  const[f,setF]=useState(blank);
  const ff=(k,v)=>setF(p=>({...p,[k]:v}));

  // Auto-calculate attendance for a staff member for a given month
  const getAttStats=(staffId,ym)=>{
    if(!staffId||!ym)return{absents:0,lates:0};
    const[y,m]=ym.split("-").map(Number);
    const days=[];const d=new Date(y,m-1,1);
    while(d.getMonth()===m-1){
      days.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`);
      d.setDate(d.getDate()+1);
    }
    let absents=0,lates=0;
    days.forEach(date=>{
      const v=satt[date]?.[staffId];
      if(v==="A")absents++;
      else if(v==="L")lates++;
    });
    return{absents,lates};
  };

  // Core salary calc
  // LLP Days  = max(0, Absent Days - Applied CLs)
  // LLP Amount = (Gross / Days in Month) x LLP Days  — auto deduction
  // Net Pay   = Gross - LLP Amount + OT Amount - ESI - PT - Advance - Other Ded + TF
  const calcNet=(x)=>{
    const gross=Number(x.grossSalary||0);
    const dim=Math.max(1,Number(x.daysInMonth||30));
    const llpDays=Math.max(0,Number(x.absentDays||0)-Number(x.clApplied||0));
    const llpAmt=Math.round((gross/dim)*llpDays);
    const otAmt=Number(x.otAmount||0);
    const grossAfterLLP=gross-llpAmt+otAmt;
    const esi=Math.round(grossAfterLLP*0.0075);
    const pt=grossAfterLLP>20000?200:grossAfterLLP>15000?150:0;
    const net=Math.round(grossAfterLLP-esi-pt-Number(x.advanceSalary||0)-Number(x.otherDed||0)+Number(x.tf||0));
    return{llpDays,llpAmt,grossAfterLLP,esi,pt,net};
  };

  const c=calcNet(f);

  const save=()=>{
        const cv=calcNet(f);
    const entry={...f,
      llpDays:cv.llpDays,
      llpAmount:cv.llpAmt,
      esiAmount:cv.esi,
      earnedGross:cv.grossAfterLLP,
      ptDeduction:cv.pt,
      netPay:cv.net,
      netSalary:cv.net,
      grossSalary:Number(f.grossSalary),
      esiEmployee:cv.esi,
      esiEmployer:Math.round(cv.grossAfterLLP*0.0375),
      id:eid||Date.now().toString()};
    if(eid)setSalaries(p=>p.map(s=>s.id===eid?entry:s));
    else setSalaries(p=>[...p,entry]);
    setShow(false);setEid(null);setF(blank);
  };

  const del=id=>{if(window.confirm("Delete?"))setSalaries(p=>p.filter(s=>s.id!==id));};

  // When staff selected in form, auto-fill designation/empId and attendance
  const onSelectStaff=(staffId)=>{
    const sm=f.date?f.date.slice(0,7):td().slice(0,7);
    const st=staff.find(s=>s.id===staffId);
    const{absents,lates}=getAttStats(staffId,sm);
    ff("staffId",staffId);
    if(st){
      setF(p=>({...p,staffId,staffName:st.name+(st.surname?" "+st.surname:""),designation:st.designation||"",employeeId:st.employeeId||"",
        absentDays:absents,noOfLates:lates,
        accCLs:p.accCLs||0,clApplied:absents,llpDays:0}));
    }
  };

  // Print individual payslip
  const printSlip=sal=>{
    const dim=Number(sal.daysInMonth||30);
    const llpAmt=Number(sal.llpAmount||0);
    const earned=Number(sal.earnedGross||Number(sal.grossSalary||0)-llpAmt);
    const netPay=Number(sal.netPay||sal.netSalary||0);
    const copy=label=>`<div class="copy"><div class="copy-lbl">${label}</div>${hdrHTML}<div class="doc-title">SALARY PAY SLIP</div>
    <div class="row2"><span><b>Employee:</b> ${sal.staffName}</span><span><b>Emp ID:</b> ${sal.employeeId||"-"}</span></div>
    <div class="row2"><span><b>Designation:</b> ${sal.designation||"-"}</span><span><b>Date:</b> ${fD(sal.date)}</span></div>
    <div class="row2"><span><b>Days in Month:</b> ${sal.daysInMonth||30}</span><span><b>Absent Days:</b> ${sal.absentDays||0}</span><span><b>LLP Days:</b> ${sal.llpDays||0}</span></div>
    <hr class="divider"/>
    <table class="data"><tr><th>Leave / Attendance</th><th>Value</th><th>Deductions</th><th>Amount</th></tr>
    <tr><td>Accumulated CLs</td><td>${sal.accCLs||0}</td><td>LLP Amount</td><td>₹${llpAmt.toLocaleString()}</td></tr>
    <tr><td>CL Applied</td><td>${sal.clApplied||0}</td><td>ESI</td><td>₹${Number(sal.esiAmount||0).toLocaleString()}</td></tr>
    <tr><td>No. of Lates</td><td>${sal.noOfLates||0}</td><td>PT Deduction</td><td>₹${Number(sal.ptDeduction||0).toLocaleString()}</td></tr>
    <tr><td>Permission (mins)</td><td>${sal.permissionMins||0}</td><td>Advance Salary</td><td>₹${Number(sal.advanceSalary||0).toLocaleString()}</td></tr>
    <tr><td>Net Acc. CLs</td><td>${sal.netAccCLs||0}</td><td>Other Deductions</td><td>₹${Number(sal.otherDed||0).toLocaleString()}</td></tr>
    <tr><td>OT Days</td><td>${sal.otDays||0}</td><td>TF</td><td>₹${Number(sal.tf||0).toLocaleString()}</td></tr>
    <tr><td>OT Amount</td><td>₹${Number(sal.otAmount||0).toLocaleString()}</td><td></td><td></td></tr>
    </table>
    <hr class="divider"/>
    <div class="row2"><span><b>Gross Salary:</b> ₹${Number(sal.grossSalary||0).toLocaleString()}</span><span><b>Earned:</b> ₹${earned.toLocaleString()}</span><span><b>Payment Mode:</b> ${sal.paymentMode||"Bank"}</span></div>
    <div class="net-box">Net Pay: ₹${netPay.toLocaleString()}</div>
    <div class="words">Amount in Words: ${n2w(netPay)}</div>
    ${sal.notes?`<div style="font-size:11px;color:#666;margin:2px 0">Notes: ${sal.notes}</div>`:""}
    <div class="spacer"></div><div class="footer">This is a computer generated pay slip. Signature is not required.<br/>${SN} · ${SA}</div></div>`;
    printDoc("Pay Slip", copy("Administration Copy")+copy("Employee Copy"));
  };

  // ── PAYROLL GENERATOR ──
  const generatePayroll=()=>{
    if(!staff||staff.length===0)return alert("No staff enrolled. Add staff in Staff Enrolment first.");
    // Actual days in selected month
    const[py,pm]=payMonth.split("-").map(Number);
    const dim=new Date(py,pm,0).getDate(); // real days in month
    const rows=staff.map(s=>{
      const sm=payMonth;
      const{absents,lates}=getAttStats(s.id,sm);
      const existingRec=salaries.find(sal=>sal.staffId===s.id&&sal.date&&sal.date.slice(0,7)===payMonth);
      if(existingRec)return{...existingRec,_staffId:s.id,_isExisting:true};
      const gross=Number(s.grossSalary||0);
      // CLs default to 0 — user enters in payroll table; LLP fully auto from absentDays & clApplied
      const clApplied=0;
      const llpDays=Math.max(0,absents-clApplied);
      const llpAmt=gross>0?Math.round((gross/dim)*llpDays):0;
      const grossAfterLLP=gross-llpAmt;
      const esi=Math.round(grossAfterLLP*0.0075);
      const pt=grossAfterLLP>20000?200:grossAfterLLP>15000?150:0;
      const net=grossAfterLLP-esi-pt;
      return{
        _staffId:s.id,_isExisting:false,
        staffId:s.id,staffName:s.name+(s.surname?" "+s.surname:""),
        designation:s.designation||"",employeeId:s.employeeId||"",
        date:payMonth+"-01",daysInMonth:dim,
        grossSalary:gross,
        // Auto from attendance — read-only in table
        absentDays:absents,noOfLates:lates,
        // CL fields — user enters in payroll table; LLP auto-recalculates on change
        accCLs:0,clApplied,clsDueToPermLate:0,
        permissionMins:0,
        llpDays,llpAmount:llpAmt,
        otDays:0,otAmount:0,
        esiAmount:esi,otherDed:0,advanceSalary:0,tf:0,
        ptDeduction:pt,earnedGross:grossAfterLLP,netPay:net,netSalary:net,
        paymentMode:"Bank",notes:`${new Date(payMonth+"-01").toLocaleString("default",{month:"long",year:"numeric"})} Salary`,
        manualNetPay:false,
      };
    });
    setPayrollRows(rows);
    setPayrollGenerated(true);
  };

  const updatePayrollRow=(idx,key,val)=>{
    setPayrollRows(prev=>{
      const rows=[...prev];
      const row={...rows[idx],[key]:val};
      // Auto-recalculate LLP Days, LLP Amount, ESI, PT, Net Pay
      const gross=Number(row.grossSalary||0);
      const dim=Math.max(1,Number(row.daysInMonth||30));
      const llpDays=Math.max(0,Number(row.absentDays||0)-Number(row.clApplied||0));
      const llpAmt=Math.round((gross/dim)*llpDays);
      const otAmt=Number(row.otAmount||0);
      const grossAfterLLP=gross-llpAmt+otAmt;
      const esi=Math.round(grossAfterLLP*0.0075);
      const pt=grossAfterLLP>20000?200:grossAfterLLP>15000?150:0;
      const net=Math.round(grossAfterLLP-esi-pt-Number(row.advanceSalary||0)-Number(row.otherDed||0)+Number(row.tf||0));
      row.llpDays=llpDays;
      row.llpAmount=llpAmt;
      row.earnedGross=grossAfterLLP;
      row.esiAmount=esi;
      row.ptDeduction=pt;
      row.netPay=net;
      row.netSalary=net;
      rows[idx]=row;
      return rows;
    });
  };

  const savePayroll=()=>{
    const toSave=payrollRows.filter(r=>!r._isExisting);
    if(toSave.length===0)return alert("All records already saved for this month.");
    const entries=toSave.map(r=>{
      const{_staffId,_isExisting,...rest}=r;

        <th>LLP Days</th>

        <th>Net Pay</th>
      </tr>
      ${rows}
      <tr style="font-weight:700;background:#f59e0b">
        <td colspan="17" style="text-align:right">TOTAL NET PAY</td>
        <td>₹${totalNet.toLocaleString()}</td>
      </tr>
    </table>
    </div>
    <div class="footer">${SN} · ${SA} · Generated: ${fD(td())}</div>`;
    printDoc("Payroll — "+monthLabel, `<div class="copy" style="padding:8mm 10mm">${body}</div>`);
  };

  const filt=salaries.filter(s=>[s.staffName,s.employeeId,s.designation,s.notes].some(x=>x?.toLowerCase().includes(q.toLowerCase())));
  const histFilt=historyStaff?salaries.filter(s=>s.staffId===historyStaff||s.staffName===staff.find(x=>x.id===historyStaff)?.name+(staff.find(x=>x.id===historyStaff)?.surname?" "+staff.find(x=>x.id===historyStaff)?.surname:"")):[]; 

  const expCSV=()=>{
    const rows=[["Staff","EmpID","Designation","Date","Gross","LLP Days","LLP Amt","OT Amt","ESI","Other Ded","PT","Net Pay","Payment Mode","Notes"],
      ...salaries.map(s=>[s.staffName,s.employeeId,s.designation,fD(s.date),s.grossSalary,s.llpDays||0,s.llpAmount||0,s.otAmount||0,s.esiAmount||0,s.otherDed||0,s.ptDeduction||0,s.netPay||s.netSalary,s.paymentMode||"Bank",s.notes])];
    const csv=rows.map(r=>r.map(c=>'"'+( c||0)+'"').join(",")).join("\n");
    const b=new Blob([csv],{type:"text/csv"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="salaries.csv";a.click();
  };

          ))}
        </div>

                <span style={{display:"flex",alignItems:"center",gap:4,color:"#e67e00"}}><span style={{background:T.amber+"22",borderRadius:4,padding:"2px 6px",fontSize:13}}>✏️ Edit</span> = enter manually</span>
              </div>

// ── STUDENT ATTENDANCE ───────────────────────────────────────────────────────
function StuAtt({students,att,setAtt,scal,canAdd,setNotifs}) {
  const[selDate,setSelDate]=useState(td());
  const[vm,setVm]=useState("daily");
  const[viewMonth,setViewMonth]=useState(()=>{const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;});
  // All enrolled students show (not just paid ones)
  const active = students;
  const isH=d=>{const[_y,_m,_dd]=d.split("-").map(Number);const dt=new Date(_y,_m-1,_dd);if(dt.getDay()===0)return"Sunday";return scal[d]||null;};
  const holiday=isH(selDate);
  const getDays=ym=>{const[y,m]=ym.split("-").map(Number);const days=[];const d=new Date(y,m-1,1);while(d.getMonth()===m-1){days.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`);d.setDate(d.getDate()+1);}return days;};
  const mdays=getDays(viewMonth);

  const gWS=d=>{const[_gy,_gm,_gd]=d.split("-").map(Number);const dt=new Date(_gy,_gm-1,_gd);const day=dt.getDay();const diff=dt.getDate()-day+(day===0?-6:1);dt.setDate(diff);return`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`;};
  const gWD=ws=>{const[_wy,_wm,_wd]=ws.split("-").map(Number);const days=[];const d=new Date(_wy,_wm-1,_wd);for(let i=0;i<7;i++){days.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`);d.setDate(d.getDate()+1);}return days;};

  const mark=(sid,status)=>{
    setAtt(prev=>{
      const upd={...prev,[selDate]:{...(prev[selDate]||{}),[sid]:status}};
      const st=students.find(s=>s.id===sid);
      if(st){
        const wk=gWS(selDate);
        const wd=gWD(wk);
        const wdata=wd.map(d=>upd[d]?.[sid]);
        const lc=wdata.filter(v=>v==="L").length;
        const ac=wdata.filter(v=>v==="A").length;
        setNotifs(prev2=>{
          const key=sid;
          const existing=prev2[key]||[];
          const msgs=[];
          const hasLate=existing.some(m=>m.wk===wk&&m.type==="late");
          const hasAbsent=existing.some(m=>m.wk===wk&&m.type==="absent");
          if(lc>=3&&!hasLate)msgs.push({type:"late",wk,text:st.name+" was late "+lc+" times this week."});
          if(ac>=2&&!hasAbsent)msgs.push({type:"absent",wk,text:st.name+" was absent "+ac+" days this week."});
          if(msgs.length)return{...prev2,[key]:[...existing,...msgs]};
          return prev2;
        });
      }
      return upd;
    });
  };
  
  const markAll=status=>{
    const u={};
    active.forEach(s=>{u[s.id]=status;});
    setAtt(p=>{
      const updated={...p,[selDate]:{...(p[selDate]||{}),...u}};
      const wk=gWS(selDate);
      const wd=gWD(wk);
      active.forEach(st=>{
        const wdata=wd.map(d=>updated[d]?.[st.id]);
        const lc=wdata.filter(v=>v==="L").length;
        const ac=wdata.filter(v=>v==="A").length;
        setNotifs(prev2=>{
          const key=st.id;
          const existing=prev2[key]||[];
          const msgs=[];
          const hasLate=existing.some(m=>m.wk===wk&&m.type==="late");
          const hasAbsent=existing.some(m=>m.wk===wk&&m.type==="absent");
          if(status==="L"&&lc>=3&&!hasLate)msgs.push({type:"late",wk,text:st.name+" was late "+lc+" times this week."});
          if(status==="A"&&ac>=2&&!hasAbsent)msgs.push({type:"absent",wk,text:st.name+" was absent "+ac+" days this week."});
          if(msgs.length)return{...prev2,[key]:[...existing,...msgs]};
          return prev2;
        });
      });
      return updated;
    });
  };

  return(
    <div>
      <PageHeader title="Student Attendance" subtitle={`${active.length} students`} actions={
        <div style={{display:"flex",gap:8}}>
          {["daily","monthly"].map(m=>(
            <button key={m} onClick={()=>setVm(m)} style={{padding:"7px 16px",border:`1px solid ${vm===m?T.accent:T.border}`,borderRadius:8,background:vm===m?T.amber+"22":"transparent",color:vm===m?T.accent:T.textMuted,cursor:"pointer",fontSize:15,fontWeight:vm===m?600:400}}>
              {m==="daily"?"Daily Register":"Monthly View"}
            </button>
          ))}
        </div>
      }/>

      {vm==="daily"&&(
        <div>
          <div style={{display:"flex",gap:10,alignItems:"center",marginBottom:16,flexWrap:"wrap"}}>
            <Input type="date" value={selDate} onChange={e=>setSelDate(e.target.value)}/>
            {holiday&&<Badge color={T.purple}>🏖 Holiday: {holiday}</Badge>}
            {canAdd&&!holiday&&(
              <div style={{display:"flex",gap:8,marginLeft:"auto"}}>
                {["P","A","L"].map(s=>(
                  <button key={s} onClick={()=>markAll(s)} style={{background:SBG[s],color:SC[s],border:`1px solid ${SC[s]}44`,padding:"6px 16px",borderRadius:8,cursor:"pointer",fontSize:15,fontWeight:600}}>
                    All {s==="P"?"Present":s==="A"?"Absent":"Late"}
                  </button>
                ))}
              </div>
            )}
          </div>
          <GlassCard>
            <Tbl>
              <thead><tr><TH>Student</TH><TH>Class</TH><TH style={{textAlign:"center"}}>Attendance</TH></tr></thead>
              <tbody>
                {active.length===0&&<tr><td colSpan={3} style={{padding:24,textAlign:"center",color:T.textMuted}}>No students enrolled yet</td></tr>}
                {active.map(st=>{
                  const dv=holiday?"H":(att[selDate]?.[st.id]||"");
                  return(<tr key={st.id}>
                    <TD style={{fontWeight:600}}>{st.name}</TD>
                    <TD><Badge>{st.class}</Badge></TD>
                    <TD style={{textAlign:"center"}}>
                      {holiday
                        ? <Badge color={T.purple}>H — Holiday</Badge>
                        : canAdd
                          ? <div style={{display:"inline-flex",gap:6}}>
                              {["P","A","L"].map(s=>(
                                <button key={s} onClick={()=>mark(st.id,s)} style={{background:dv===s?SBG[s]:T.surface2,color:dv===s?SC[s]:T.textMuted,border:`1px solid ${dv===s?SC[s]:T.border}`,width:38,height:34,borderRadius:8,cursor:"pointer",fontWeight:dv===s?700:400,fontSize:16,transition:"all 0.1s"}}>{s}</button>
                              ))}
                            </div>
                          : <Badge color={SC[dv]||T.textMuted}>{dv||"—"}</Badge>
                      }
                    </TD>
                  </tr>);
                })}
              </tbody>
            </Tbl>
          </GlassCard>
        </div>
      )}

      {vm==="monthly"&&(
        <div>
          <div style={{marginBottom:12}}>
            <Input type="month" value={viewMonth} onChange={e=>setViewMonth(e.target.value)}/>
          </div>
          <GlassCard style={{overflowX:"auto"}}>
            <table style={{borderCollapse:"collapse",fontSize:13,minWidth:"max-content",width:"100%"}}>
              <thead><tr>
                <th style={{padding:"8px 12px",textAlign:"left",background:T.surface2,color:T.textMuted,borderBottom:`1px solid ${T.border}`,position:"sticky",left:0,zIndex:1,minWidth:130,fontSize:14}}>Student</th>
                {mdays.map(d=>{const dt=new Date(d);const h=isH(d);return<th key={d} style={{padding:"6px 8px",textAlign:"center",background:T.surface2,color:h?T.purple:T.textMuted,borderBottom:`1px solid ${T.border}`,whiteSpace:"nowrap",fontSize:12}}>{dt.getDate()}<br/><span style={{fontSize:10}}>{["Su","Mo","Tu","We","Th","Fr","Sa"][dt.getDay()]}</span></th>;})}
                <th style={{padding:"8px 10px",textAlign:"center",background:T.surface2,color:T.textMuted,borderBottom:`1px solid ${T.border}`,fontSize:13,whiteSpace:"nowrap"}}>P/A/L</th>
              </tr></thead>
              <tbody>
                {active.map(st=>{
                  let p=0,a=0,l=0;mdays.forEach(d=>{const v=att[d]?.[st.id];if(v==="P")p++;else if(v==="A")a++;else if(v==="L")l++;});
                  return(<tr key={st.id}>
                    <td style={{padding:"7px 12px",color:T.text,fontWeight:500,position:"sticky",left:0,background:T.surface,zIndex:1,fontSize:14,borderBottom:`1px solid ${T.border}22`}}>{st.name}</td>
                    {mdays.map(d=>{const h=isH(d);const v=h?"H":(att[d]?.[st.id]||"");return<td key={d} style={{padding:"4px 6px",textAlign:"center",background:SBG[v]||"transparent",borderBottom:`1px solid ${T.border}22`}}><span style={{color:SC[v]||T.textMuted,fontWeight:v?700:400,fontSize:13}}>{v||"·"}</span></td>;})}
                    <td style={{padding:"6px 8px",textAlign:"center",fontSize:14,borderBottom:`1px solid ${T.border}22`,fontWeight:600}}><span style={{color:T.green}}>{p}</span><span style={{color:T.textMuted}}>/</span><span style={{color:T.red}}>{a}</span><span style={{color:T.textMuted}}>/</span><span style={{color:"#e67e00"}}>{l}</span></td>
                  </tr>);
                })}
              </tbody>
            </table>
          </GlassCard>
        </div>
      )}
    </div>
  );
}

// ── STAFF ENROLMENT ─────────────────────────────────────────────────────────
function StaffEnroll({staff,setStaff,canAdd,canEdit,canDel,leftStaff,setLeftStaff,trash,setTrash}) {
  const blank={name:"",surname:"",employeeId:"",designation:"",dob:"",placeOfBirth:"",qualification:"",experience:"",mobile:"",mobile2:"",email:"",fatherName:"",aadhar:"",dateOfJoining:td(),address:"",grossSalary:"",accCLs:0};
  const[f,setF]=useState(blank);
  const[saved,setSaved]=useState(null);
  const[editId,setEditId]=useState(null);
  const ff=(key,val)=>setF(p=>({...p,[key]:val}));
  const[markLeftId,setMarkLeftId]=useState(null);
  const[leftReason,setLeftReason]=useState("");

  const markLeft=()=>{
    const s=staff.find(x=>x.id===markLeftId);
    if(!s)return;
    if(!leftReason.trim())return alert("Please enter a reason");
    const leftEntry={...s,leftDate:td(),leftReason};
    setLeftStaff(p=>[...p,leftEntry]);
    setStaff(p=>p.filter(x=>x.id!==markLeftId));
    setMarkLeftId(null);setLeftReason("");
  };

  const deleteAll=()=>{
    if(!window.confirm("Export all staff to Excel and move to Trash?"))return;
    const rows=[["Name","Surname","EmpID","Designation","Mobile","Email","Date of Joining"],...staff.map(s=>[s.name,s.surname,s.employeeId,s.designation,s.mobile,s.email,fD(s.dateOfJoining)])];
    const csv=rows.map(r=>r.map(c=>'"'+( c||"")+'"').join(",")).join("\n");
    const b=new Blob([csv],{type:"text/csv"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="staff_backup.csv";a.click();
    const trashItems=staff.map(s=>({...s,_trashType:"staff",_trashedAt:Date.now()}));
    setTrash(p=>[...p,...trashItems]);
    setStaff([]);
  };

  const save=()=>{
        if(editId){setStaff(p=>p.map(s=>s.id===editId?{...s,...f}:s));setSaved({...f,id:editId});setEditId(null);}
    else{const entry={...f,id:Date.now().toString()};setStaff(p=>[...p,entry]);setSaved(entry);}
    setF(blank);
  };

  const printForm=s=>{
    const copy=label=>`<div class="copy"><div class="copy-lbl">${label}</div>${hdrHTML}<div class="doc-title">STAFF ENROLLMENT FORM</div>
    <table class="data kv">
      <tr><td>Name</td><td>${s.name} ${s.surname||""}</td><td>Employee ID</td><td>${s.employeeId||"-"}</td></tr>
      <tr><td>Designation</td><td>${s.designation||"-"}</td><td>Date of Joining</td><td>${fD(s.dateOfJoining)}</td></tr>
      <tr><td>Date of Birth</td><td>${s.dob||"-"}</td><td>Place of Birth</td><td>${s.placeOfBirth||"-"}</td></tr>
      <tr><td>Qualification</td><td>${s.qualification||"-"}</td><td>Experience</td><td>${s.experience||"-"}</td></tr>
      <tr><td>Mobile</td><td>${s.mobile||"-"}</td><td>Email</td><td>${s.email||"-"}</td></tr>
      <tr><td>Father/Husband Name</td><td>${s.fatherName||"-"}</td><td>Aadhar No.</td><td>${s.aadhar||"-"}</td></tr>
      <tr><td colspan="4">Address: ${s.address||"-"}</td></tr>
    </table>
    <div class="footer">${SN} · ${SA} · Ph: ${SP}</div></div>`;
    printDoc("Staff Enrollment Form", copy("Administration Copy")+copy("Employee Copy"));
  };

  return(
    <div>
      <PageHeader title="Staff Enrolment" subtitle="Add or update staff records"/>
      <div style={{display:"grid",gridTemplateColumns:"1fr 340px",gap:16,alignItems:"start"}}>
        <GlassCard style={{padding:24}}>
          <h3 style={{fontSize:17,fontWeight:600,color:T.text,marginBottom:20}}>{editId?"Edit Staff":"New Staff Enrolment"}</h3>
          <SectionDivider title="Personal Details"/>
          <FormGrid>
            <Input label="First Name *" value={f.name} onChange={e=>ff("name",e.target.value)} fullWidth/>
            <Input label="Surname" value={f.surname} onChange={e=>ff("surname",e.target.value)} fullWidth/>
            <Input label="Employee ID" value={f.employeeId} onChange={e=>ff("employeeId",e.target.value)} fullWidth/>
            <Input label="Designation" value={f.designation} onChange={e=>ff("designation",e.target.value)} fullWidth/>
            <Input label="Date of Birth" type="date" value={f.dob} onChange={e=>ff("dob",e.target.value)} fullWidth/>
            <Input label="Place of Birth" value={f.placeOfBirth} onChange={e=>ff("placeOfBirth",e.target.value)} fullWidth/>
            <Input label="Qualification" value={f.qualification} onChange={e=>ff("qualification",e.target.value)} fullWidth/>
            <Input label="Experience" value={f.experience} onChange={e=>ff("experience",e.target.value)} fullWidth/>
            <Input label="Date of Joining" type="date" value={f.dateOfJoining} onChange={e=>ff("dateOfJoining",e.target.value)} fullWidth/>
          </FormGrid>
          <SectionDivider title="Salary Details"/>
          <FormGrid>
            <Input label="Gross Salary (₹) — for payroll" type="number" value={f.grossSalary||""} onChange={e=>ff("grossSalary",e.target.value)} fullWidth/>

          </FormGrid>
          {canAdd&&(
            <div style={{display:"flex",gap:10,marginTop:20}}>

          )}

        <div style={{display:"flex",flexDirection:"column",gap:14}}>

            <GlassCard style={{padding:16,border:`1px solid ${T.green}44`}}>

              <div style={{fontSize:15,color:T.text,marginBottom:2}}><b>{saved.name} {saved.surname}</b></div>
              <div style={{fontSize:14,color:T.textMuted,marginBottom:12}}>{saved.designation}</div>
              <Btn onClick={()=>printForm(saved)} variant="success" style={{width:"100%",justifyContent:"center"}}>🖨 Print Enrollment Form</Btn>
            </GlassCard>
          )}
          <GlassCard style={{padding:16}}>
            <div style={{fontSize:15,fontWeight:600,color:T.text,marginBottom:12}}>Recent Staff</div>

              <div style={{background:T.amber+"11",border:`1px solid ${T.amber}44`,borderRadius:8,padding:12,marginBottom:10}}>
                <div style={{fontWeight:600,color:"#e67e00",fontSize:14,marginBottom:8}}>Reason for leaving *</div>

                <div style={{display:"flex",gap:6,marginTop:8}}>
                  <Btn onClick={markLeft} variant="danger" sm>Confirm Left</Btn>
                  <Btn onClick={()=>{setMarkLeftId(null);setLeftReason("");}} variant="secondary" sm>Cancel</Btn>
                </div>
              </div>

            {[...staff].filter(s=>!s.leftDate).sort((a,b)=>b.id-a.id).slice(0,6).map(s=>(

                  <div style={{fontSize:15,fontWeight:500,color:T.text}}>{s.name} {s.surname}</div>

          </GlassCard>
        </div>
      </div>
    </div>
  );
}

function CalMod({scal,setScal,stcal,setStcal,canAdd,canEdit}) {
  const[ct,setCt]=useState("school");

  const addH=()=>{if(!nn)return;setCal(p=>({...p,[nd]:nn}));setNd(td());setNn("");setShowAdd(false);};
  const remH=date=>setCal(p=>{const n={...p};delete n[date];return n;});
  const[y,m]=sm.split("-").map(Number);
  const fd=new Date(y,m-1,1).getDay();const dim=new Date(y,m,0).getDate();

  return(
    <div>

        <div style={{display:"flex",gap:8}}>

      <div style={{display:"grid",gridTemplateColumns:"1fr 300px",gap:16}}>
        <GlassCard style={{padding:24}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
            <Input type="month" value={sm} onChange={e=>setSm(e.target.value)}/>

          {showAdd&&(
            <div style={{background:T.surface2,borderRadius:10,padding:16,marginBottom:20,display:"flex",gap:10,flexWrap:"wrap"}}>
              <Input type="date" value={nd} onChange={e=>setNd(e.target.value)}/>
              <Input placeholder="Holiday name" value={nn} onChange={e=>setNn(e.target.value)} style={{flex:1,minWidth:150}}/>

          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4}}>
            {["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map((d,i)=>(
              <div key={i} style={{textAlign:"center",fontSize:13,fontWeight:600,color:i===0?T.red:T.textMuted,padding:"4px 0",marginBottom:4}}>{d}</div>
            ))}
            {Array(fd).fill(null).map((_,i)=><div key={`e${i}`}/>)}
            {Array(dim).fill(null).map((_,i)=>{
              const day=i+1;
              const ds=`${y}-${String(m).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
              const dt=new Date(ds);const isSun=dt.getDay()===0;const hn=cal[ds];const isTo=ds===td();
              return(
                <div key={day} style={{textAlign:"center",padding:"6px 2px",borderRadius:8,background:isTo?T.accent:hn||isSun?T.purple+"22":"transparent",fontSize:15,fontWeight:isTo?700:400,border:isTo?`1px solid ${T.accent}`:"1px solid transparent",position:"relative",minHeight:44,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:2}} title={hn||(isSun?"Sunday":"")}>
                  <span style={{color:isTo?"#fff":hn||isSun?T.purple:T.text,fontWeight:isTo?700:400}}>{day}</span>
                  {(hn||isSun)&&<span style={{fontSize:10,color:isTo?"rgba(255,255,255,0.8)":T.purple}}>{hn?hn.slice(0,5):"Sun"}</span>}
                  {hn&&(canAdd||canEdit)&&(
                    <button onClick={(e)=>{e.stopPropagation();remH(ds);}} title={"Remove: "+hn} style={{position:"absolute",top:2,right:2,background:T.red+"33",color:T.red,border:"none",borderRadius:4,width:14,height:14,cursor:"pointer",fontSize:12,display:"flex",alignItems:"center",justifyContent:"center",lineHeight:1,padding:0}}>×</button>
                  )}

        </GlassCard>
        <div style={{display:"flex",flexDirection:"column",gap:14}}>
          <GlassCard style={{padding:16}}>
            <h3 style={{fontSize:15,fontWeight:600,color:T.text,marginBottom:12}}>Holidays — {new Date(y,m-1).toLocaleString("default",{month:"long"})} {y}</h3>
            {holidays.length===0&&<div style={{color:T.textMuted,fontSize:14}}>No holidays this month (Sundays are auto)</div>}

function Stock({expenses,extraCats,setExtraCats,extraSubcats,setExtraSubcats,canAdd,canEdit,canDel}) {
  const[q,setQ]=useState("");
  const[catFilter,setCatFilter]=useState("All");

  const filt=expenses.filter(e=>{

    const matchCat=catFilter==="All"||e.category===catFilter;
    return matchQ&&matchCat;

  // Group by category for summary

    const k=e.category||"Uncategorized";

      ...filt.map(e=>[fD(e.date),e.category,e.subCategory||"",e.vendorName,e.quantity||1,e.unit||"",e.amount,e.notes])

  };

  return(
    <div>

          <div style={{fontSize:13,color:T.textMuted,marginBottom:4}}>Total Items</div>

        </div>
        <div style={{background:T.surface,border:`1px solid ${T.border}`,borderRadius:10,padding:"12px 16px"}}>
          <div style={{fontSize:13,color:T.textMuted,marginBottom:4}}>Categories Used</div>
          <div style={{fontSize:22,fontWeight:700,color:T.purple}}>{Object.keys(summary).length}</div>
        </div>

      {/* Category filter chips */}
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:16}}>
        {["All",...allCats].map(cat=>(
          <button key={cat} onClick={()=>setCatFilter(cat)} style={{padding:"5px 12px",borderRadius:99,border:`1px solid ${catFilter===cat?T.accent:T.border}`,background:catFilter===cat?T.amber+"22":"transparent",color:catFilter===cat?T.accent:T.textMuted,cursor:"pointer",fontSize:14,fontWeight:catFilter===cat?600:400,whiteSpace:"nowrap"}}>
            {cat} {summary[cat]?<span style={{opacity:.7}}>({summary[cat].count})</span>:""}

      {/* Category summary strip */}

// ── EXAMS ─────────────────────────────────────────────────────────────────────
function Exams({exams,setExams,students,canAdd,canEdit,canDel,canAddHEM,canEditHEM,canDelHEM}) {
  const[q,setQ]=useState("");
  const[show,setShow]=useState(false);
  const[eid,setEid]=useState(null);
  const[filterStu,setFilterStu]=useState("");
  const blank={studentId:"",examName:"",subject:"",date:td(),totalMarks:100,marksObtained:"",grade:"",notes:"",improvements:""};
  const[f,setF]=useState(blank);

  const filt=exams.filter(e=>{
    const st=students.find(s=>s.id===e.studentId);
    const matchQ=[st?.name,e.examName,e.subject,e.grade].some(x=>x?.toLowerCase().includes(q.toLowerCase()));
    const matchStu=!filterStu||e.studentId===filterStu;
    return matchQ&&matchStu;
  });

  const save=()=>{
    if(!f.studentId||!f.examName||f.marksObtained==="")return alert("Student, Exam Name & Marks required");
    const pct=Math.round((Number(f.marksObtained)/Number(f.totalMarks||100))*100);
    const grade=f.grade||(pct>=90?"A+":(pct>=80?"A":(pct>=70?"B":(pct>=60?"C":(pct>=50?"D":"F")))));
    const entry={...f,percentage:pct,grade,id:eid||Date.now().toString()};
    if(eid)setExams(p=>p.map(x=>x.id===eid?entry:x));
    else setExams(p=>[...p,entry]);
    setShow(false);setEid(null);setF(blank);
  };
  const del=id=>{if(window.confirm("Delete?"))setExams(p=>p.filter(x=>x.id!==id));};

  const gradeColor=g=>{
    if(!g)return T.textMuted;
    if(g==="A+"||g==="A")return T.green;
    if(g==="B")return T.accent;
    if(g==="C")return T.amber;
    if(g==="D")return T.amber;
    return T.red;
  };

  const expCSV=()=>{
    const rows=[["Student","Exam","Subject","Date","Total","Obtained","Percentage","Grade","Notes","Improvements"],
      ...exams.map(e=>{const st=students.find(s=>s.id===e.studentId);return[st?.name||"?",e.examName,e.subject,fD(e.date),e.totalMarks,e.marksObtained,e.percentage+"%",e.grade,e.notes,e.improvements];})
    ];
    const csv=makeCSV(rows);
    const b=new Blob([csv],{type:"text/csv"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="exams.csv";a.click();
  };

  return(
    <div>

          {(canAdd||canAddHEM)&&<Btn onClick={()=>{setF(blank);setEid(null);setShow(true);}}>+ Add Result</Btn>}
        </>

      {show&&canAdd&&(
        <GlassCard style={{padding:24,marginBottom:16}}>
          <h3 style={{fontSize:17,fontWeight:600,color:T.text,marginBottom:16}}>{eid?"Edit":"Add"} Exam Result</h3>
          <FormGrid>
            <div>
              <label style={{fontSize:13,color:T.textMuted,fontWeight:500,display:"block",marginBottom:4}}>Student *</label>
              <select value={f.studentId} onChange={e=>setF(p=>({...p,studentId:e.target.value}))} style={{background:T.surface2,border:`1px solid ${T.border}`,borderRadius:8,padding:"9px 12px",color:T.text,fontSize:15,width:"100%",outline:"none"}}>
                <option value="">Select Student</option>
                {students.map(s=><option key={s.id} value={s.id}>{s.name} ({s.class})</option>)}
              </select>
            </div>
            <Input label="Exam Name *" value={f.examName} onChange={e=>setF(p=>({...p,examName:e.target.value}))} placeholder="e.g. Unit Test 1, Mid-Term" fullWidth/>
            <Input label="Subject" value={f.subject} onChange={e=>setF(p=>({...p,subject:e.target.value}))} fullWidth/>
