            <Input label="Total Marks" type="number" value={f.totalMarks} onChange={e=>setF(p=>({...p,totalMarks:e.target.value}))} fullWidth/>
            <Input label="Marks Obtained *" type="number" value={f.marksObtained} onChange={e=>setF(p=>({...p,marksObtained:e.target.value}))} fullWidth/>
            <Input label="Grade (auto if blank)" value={f.grade} onChange={e=>setF(p=>({...p,grade:e.target.value}))} placeholder="Auto-calculated" fullWidth/>
            <div style={{gridColumn:"1/-1"}}><Input label="Teacher's Notes" value={f.notes} onChange={e=>setF(p=>({...p,notes:e.target.value}))} fullWidth placeholder="General performance notes"/></div>
            <div style={{gridColumn:"1/-1"}}><Input label="Areas for Improvement" value={f.improvements} onChange={e=>setF(p=>({...p,improvements:e.target.value}))} fullWidth placeholder="Specific topics/skills to work on"/></div>
          </FormGrid>
          {f.marksObtained!==""&&f.totalMarks&&(
            <div style={{marginTop:12,padding:"10px 14px",background:T.surface2,borderRadius:8,display:"flex",gap:16,alignItems:"center"}}>
              <span style={{fontSize:14,color:T.textMuted}}>Preview:</span>
              <span style={{fontSize:18,fontWeight:700,color:"#e67e00"}}>{Math.round((Number(f.marksObtained)/Number(f.totalMarks))*100)}%</span>
              <span style={{fontSize:15,fontWeight:700,color:gradeColor(f.grade||(()=>{const p2=Math.round((Number(f.marksObtained)/Number(f.totalMarks))*100);return p2>=90?"A+":p2>=80?"A":p2>=70?"B":p2>=60?"C":p2>=50?"D":"F";})())}}>
                Grade: {f.grade||(()=>{const p2=Math.round((Number(f.marksObtained)/Number(f.totalMarks))*100);return p2>=90?"A+":p2>=80?"A":p2>=70?"B":p2>=60?"C":p2>=50?"D":"F";})()}
              </span>
            </div>
          )}
          <div style={{display:"flex",gap:8,marginTop:16}}>
            <Btn onClick={save}>Save Result</Btn>
            <Btn onClick={()=>{setShow(false);setEid(null);}} variant="secondary">Cancel</Btn>
          </div>
        </GlassCard>
      )}

      <GlassCard>
        <Tbl>
          <thead><tr><TH>Date</TH><TH>Student</TH><TH>Class</TH><TH>Exam</TH><TH>Subject</TH><TH>Marks</TH><TH>%</TH><TH>Grade</TH><TH>Description</TH><TH>Improvements</TH><TH>Actions</TH></tr></thead>
          <tbody>
            {filt.length===0&&<tr><td colSpan={11} style={{padding:24,textAlign:"center",color:T.textMuted}}>No exam results yet</td></tr>}
            {filt.map(e=>{
              const st=students.find(s=>s.id===e.studentId);
              return(<tr key={e.id}>
                <TD style={{color:T.textMuted,whiteSpace:"nowrap"}}>{fD(e.date)}</TD>
                <TD style={{fontWeight:600}}>{st?.name||"?"}</TD>
                <TD><Badge>{st?.class||"?"}</Badge></TD>
                <TD style={{fontWeight:500}}>{e.examName}</TD>
                <TD style={{color:T.textMuted}}>{e.subject}</TD>
                <TD>{e.marksObtained}/{e.totalMarks}</TD>
                <TD style={{fontWeight:700,color:e.percentage>=50?T.green:T.red}}>{e.percentage}%</TD>
                <TD><Badge color={gradeColor(e.grade)}>{e.grade}</Badge></TD>
                <TD style={{color:T.textMuted,maxWidth:160,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{e.notes}</TD>
                <TD style={{color:"#e67e00",maxWidth:160,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{e.improvements}</TD>
                <TD><div style={{display:"flex",gap:4}}>
                  {(canEdit||canEditHEM)&&<Btn onClick={()=>{setF({...e});setEid(e.id);setShow(true);}} variant="ghost" sm>Edit</Btn>}
                  {(canDel||canDelHEM)&&<Btn onClick={()=>del(e.id)} variant="danger" sm>Del</Btn>}
                </div></TD>
              </tr>);
            })}
          </tbody>
        </Tbl>
      </GlassCard>
    </div>
  );
}

// ── MESSAGES ─────────────────────────────────────────────────────────────────
function Messages({messages,setMessages,students,staff,notifs,setNotifs,canAdd,canEdit,canDel,isAdmin,isAcc}) {
  const[show,setShow]=useState(false);
  const[q,setQ]=useState("");
  const blank={studentId:"",subject:"",body:"",date:td(),fromName:"",priority:"Normal"};
  const[f,setF]=useState(blank);

  const canSend=canAdd;

  const filt=messages.filter(m=>{
    const st=students.find(s=>s.id===m.studentId);
    return[st?.name,m.subject,m.body,m.fromName].some(x=>x?.toLowerCase().includes(q.toLowerCase()));
  });

  const send=()=>{
    if(!f.studentId||!f.subject||!f.body)return alert("Student, Subject & Message required");
    const entry={...f,id:Date.now().toString(),read:false};
    setMessages(p=>[...p,entry]);
    const notifMsg={type:"message",wk:"msg",text:"Message from "+(f.fromName||"School")+": "+f.subject};
    setNotifs(p=>({...p,[f.studentId]:[...(p[f.studentId]||[]),notifMsg]}));
    setShow(false);setF(blank);
  };

  const del=id=>{if(window.confirm("Delete message?"))setMessages(p=>p.filter(m=>m.id!==id));};

  const priorityColor={Normal:T.accent,Urgent:T.red,Info:T.green};

  return(
    <div>
      <PageHeader title="Messages to Parents" subtitle={`${filt.length} messages`} actions={
        <>
          <Input placeholder="Search..." value={q} onChange={e=>setQ(e.target.value)} style={{width:200}}/>
          {canSend&&<Btn onClick={()=>{setShow(true);setF(blank);}}>✉ New Message</Btn>}
        </>
      }/>

      {show&&canSend&&(
        <GlassCard style={{padding:24,marginBottom:16,border:`1px solid ${T.accent}44`}}>
          <h3 style={{fontSize:17,fontWeight:600,color:T.text,marginBottom:16}}>Send Message to Parent</h3>
          <FormGrid>
            <div>
              <label style={{fontSize:13,color:T.textMuted,fontWeight:500,display:"block",marginBottom:4}}>Student (selects parent) *</label>
              <select value={f.studentId} onChange={e=>setF(p=>({...p,studentId:e.target.value}))} style={{background:T.surface2,border:`1px solid ${T.border}`,borderRadius:8,padding:"9px 12px",color:T.text,fontSize:15,width:"100%",outline:"none"}}>
                <option value="">Select Student</option>
                {students.map(s=><option key={s.id} value={s.id}>{s.name} ({s.class}) — Parent: {s.fatherName||s.motherName||"?"}</option>)}
              </select>
            </div>
            <Input label="From (Your Name)" value={f.fromName} onChange={e=>setF(p=>({...p,fromName:e.target.value}))} fullWidth placeholder="e.g. Class Teacher"/>
            <Input label="Subject *" value={f.subject} onChange={e=>setF(p=>({...p,subject:e.target.value}))} fullWidth placeholder="e.g. Homework Reminder"/>
            <div>
              <label style={{fontSize:13,color:T.textMuted,fontWeight:500,display:"block",marginBottom:4}}>Priority</label>
              <select value={f.priority} onChange={e=>setF(p=>({...p,priority:e.target.value}))} style={{background:T.surface2,border:`1px solid ${T.border}`,borderRadius:8,padding:"9px 12px",color:T.text,fontSize:15,width:"100%",outline:"none"}}>
                <option>Normal</option><option>Urgent</option><option>Info</option>
              </select>
            </div>
            <div style={{gridColumn:"1/-1"}}>
              <label style={{fontSize:13,color:T.textMuted,fontWeight:500,display:"block",marginBottom:4}}>Message *</label>
              <textarea value={f.body} onChange={e=>setF(p=>({...p,body:e.target.value}))} rows={4} placeholder="Type your message to the parent here..." style={{background:T.surface2,border:`1px solid ${T.border}`,borderRadius:8,padding:"9px 12px",color:T.text,fontSize:15,width:"100%",outline:"none",resize:"vertical"}}/>
            </div>
          </FormGrid>
          {f.studentId&&(()=>{const st=students.find(s=>s.id===f.studentId);const pn=(st?.fatherName||st?.motherName||'').toLowerCase().trim();return pn?(<div style={{marginTop:10,padding:"8px 12px",background:T.green+"15",borderRadius:8,fontSize:14,color:T.green}}>✓ Will notify: {pn}</div>):(<div style={{marginTop:10,padding:"8px 12px",background:T.amber+"15",borderRadius:8,fontSize:14,color:"#e67e00"}}>⚠ No parent name on file for this student</div>);})()}
          <div style={{display:"flex",gap:8,marginTop:16}}>
            <Btn onClick={send}>Send Message</Btn>
            <Btn onClick={()=>setShow(false)} variant="secondary">Cancel</Btn>
          </div>
        </GlassCard>
      )}

      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        {filt.length===0&&<GlassCard style={{padding:24,textAlign:"center",color:T.textMuted}}>No messages sent yet</GlassCard>}
        {filt.map(m=>{
          const st=students.find(s=>s.id===m.studentId);
          const pn=(st?.fatherName||st?.motherName||'').toLowerCase().trim();
          return(
            <GlassCard key={m.id} style={{padding:16,borderLeft:`3px solid ${priorityColor[m.priority]||T.accent}`}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8,flexWrap:"wrap",gap:8}}>
                <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
                  <Badge color={priorityColor[m.priority]||T.accent}>{m.priority}</Badge>
                  <span style={{fontWeight:600,color:T.text,fontSize:16}}>{m.subject}</span>
                </div>
                <div style={{display:"flex",gap:6,alignItems:"center"}}>
                  <span style={{fontSize:13,color:T.textMuted}}>{fD(m.date)}</span>
                  {(canDel||canDelHEM)&&<Btn onClick={()=>del(m.id)} variant="danger" sm>Del</Btn>}
                </div>
              </div>
              <div style={{display:"flex",gap:16,marginBottom:8,flexWrap:"wrap"}}>
                <span style={{fontSize:14,color:T.textMuted}}>To: <span style={{color:T.text,fontWeight:500}}>{st?.name||"?"} ({st?.class})</span></span>
                <span style={{fontSize:14,color:T.textMuted}}>Parent: <span style={{color:"#e67e00",fontWeight:500}}>{pn||"?"}</span></span>
                {m.fromName&&<span style={{fontSize:14,color:T.textMuted}}>From: <span style={{color:T.text}}>{m.fromName}</span></span>}
              </div>
              <div style={{fontSize:15,color:T.text,lineHeight:1.6,background:T.surface2,padding:"10px 14px",borderRadius:8}}>{m.body}</div>
            </GlassCard>
          );
        })}
      </div>
    </div>
  );
}

// ── PARENT PORTAL ─────────────────────────────────────────────────────────────
function ParentPortal({auth,setAuth,students,payments,att,notifs,dismissN,scal,hw,exams,messages}) {
  const st=students.find(s=>s.id===auth.studentId);
  const[activeTab,setActiveTab]=useState("overview");
  const[vm,setVm]=useState(()=>{const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;});
  const myN=notifs[auth.studentId]||[];
  const isH=d=>{const[_y,_m,_dd]=d.split("-").map(Number);const dt=new Date(_y,_m-1,_dd);if(dt.getDay()===0)return"Sunday";return scal[d]||null;};
  const getDays=ym=>{const[y,m]=ym.split("-").map(Number);const days=[];const d=new Date(y,m-1,1);while(d.getMonth()===m-1){days.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`);d.setDate(d.getDate()+1);}return days;};
  const mdays=getDays(vm);
  let p=0,a=0,l=0,wd=0;
  mdays.forEach(d=>{if(!isH(d)){wd++;const v=att[d]?.[auth.studentId];if(v==="P")p++;else if(v==="A")a++;else if(v==="L")l++;}});
  const pct=wd>0?((p+l*0.5)/wd*100).toFixed(1):"N/A";

  // Student's homeworks
  const stuHw=hw.filter(h=>!h.class||(st&&h.class===st.class));
  // Student's exams
  const stuExams=exams.filter(e=>e.studentId===auth.studentId);
  // Messages for this parent
  const pn=st?(st.fatherName||st.motherName):"";
  const myMessages=messages.filter(m=>m.studentId===auth.studentId);

  const PORTAL_TABS=[
    {id:"overview",icon:"🏠",label:"Overview"},
    {id:"attendance",icon:"📅",label:"Attendance"},
    {id:"homeworks",icon:"📚",label:"Homeworks"},
    {id:"exams",icon:"📋",label:"Exam Results"},
    {id:"messages",icon:"💬",label:"Messages"},
    {id:"alerts",icon:"🔔",label:`Alerts${myN.length>0?` (${myN.length})`:""}` },
  ];

  return(
    <div style={{minHeight:"100vh",background:T.bg,fontFamily:"'Inter',sans-serif"}}>
      {/* Header */}
      <div style={{background:T.surface,borderBottom:`1px solid ${T.border}`,padding:"0 20px",display:"flex",alignItems:"center",gap:14,minHeight:60}}>
        <img src={LOGO_URI} style={{width:36,height:36,borderRadius:8,objectFit:"contain"}} alt="logo"/>
        <div style={{flex:1}}>
          <div style={{fontWeight:700,fontSize:16,color:T.text}}>{SN} — Parent Portal</div>
          <div style={{fontSize:13,color:T.textMuted}}>Welcome, {auth.name}</div>
        </div>
        {myN.length>0&&<div style={{background:T.red,color:"#fff",borderRadius:99,fontSize:13,fontWeight:700,padding:"2px 8px",minWidth:20,textAlign:"center"}}>{myN.length}</div>}
        <Btn onClick={()=>setAuth(null)} variant="secondary">Logout</Btn>
      </div>

      {/* Sub Nav */}
      <div style={{background:T.surface,borderBottom:`1px solid ${T.border}`,display:"flex",overflowX:"auto",padding:"0 16px"}}>
        {PORTAL_TABS.map(tab=>(
          <button key={tab.id} onClick={()=>setActiveTab(tab.id)} style={{padding:"10px 14px",border:"none",borderBottom:activeTab===tab.id?`2px solid ${T.accent}`:"2px solid transparent",background:"transparent",color:activeTab===tab.id?T.accent:T.textMuted,cursor:"pointer",fontSize:14,fontWeight:activeTab===tab.id?600:400,whiteSpace:"nowrap",display:"flex",alignItems:"center",gap:5}}>
            {tab.icon} {tab.label}
            {tab.id==="alerts"&&myN.length>0&&<span style={{background:T.red,color:"#fff",borderRadius:99,fontSize:12,fontWeight:700,padding:"1px 5px"}}>{myN.length}</span>}
          </button>
        ))}
      </div>

      <div style={{padding:20,maxWidth:960,margin:"0 auto"}}>
        {/* OVERVIEW TAB */}
        {activeTab==="overview"&&(
          <div>
            {st&&(
              <GlassCard style={{padding:20,marginBottom:16}}>
                <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:16}}>
                  <div style={{width:52,height:52,borderRadius:12,background:T.amber+"33",display:"flex",alignItems:"center",justifyContent:"center",fontSize:24,fontWeight:700,color:"#e67e00"}}>{st.name[0]}</div>
                  <div>
                    <div style={{fontSize:20,fontWeight:700,color:T.text}}>{st.name}</div>
                    <div style={{fontSize:15,color:T.textMuted}}>{st.class} · ID: {st.studentId}</div>
                  </div>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:10}}>
                  {[["Father",st.fatherName],["Mother",st.motherName],["Mobile",st.mobile1],["Enrolled",fD(st.dateOfEnrollment)]].map(([l,v])=>(
                    <div key={l} style={{background:T.surface2,borderRadius:8,padding:"8px 12px"}}>
                      <div style={{fontSize:12,color:T.textMuted}}>{l}</div>
                      <div style={{color:T.text,fontWeight:500,fontSize:15}}>{v||"—"}</div>
                    </div>
                  ))}
                </div>
              </GlassCard>
            )}
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:12,marginBottom:16}}>
              <div style={{background:T.surface,border:`1px solid ${T.border}`,borderRadius:10,padding:"14px 16px"}}>
                <div style={{fontSize:13,color:T.textMuted}}>Attendance %</div>
                <div style={{fontSize:24,fontWeight:700,color:pct>=75?T.green:T.red}}>{pct}{pct!=="N/A"?"%":""}</div>
              </div>
              <div style={{background:T.surface,border:`1px solid ${T.border}`,borderRadius:10,padding:"14px 16px"}}>
                <div style={{fontSize:13,color:T.textMuted}}>Exams Taken</div>
                <div style={{fontSize:24,fontWeight:700,color:"#e67e00"}}>{stuExams.length}</div>
              </div>
              <div style={{background:T.surface,border:`1px solid ${T.border}`,borderRadius:10,padding:"14px 16px"}}>
                <div style={{fontSize:13,color:T.textMuted}}>Avg Score</div>
                <div style={{fontSize:24,fontWeight:700,color:T.purple}}>
                  {stuExams.length>0?Math.round(stuExams.reduce((s,e)=>s+Number(e.percentage||0),0)/stuExams.length)+"%":"—"}
                </div>
              </div>
              <div style={{background:T.surface,border:`1px solid ${T.border}`,borderRadius:10,padding:"14px 16px"}}>
                <div style={{fontSize:13,color:T.textMuted}}>Pending Homeworks</div>
                <div style={{fontSize:24,fontWeight:700,color:"#e67e00"}}>{stuHw.filter(h=>h.dueDate&&new Date(h.dueDate)>=new Date()).length}</div>
              </div>
              <div style={{background:T.surface,border:`1px solid ${T.border}`,borderRadius:10,padding:"14px 16px"}}>
                <div style={{fontSize:13,color:T.textMuted}}>Unread Alerts</div>
                <div style={{fontSize:24,fontWeight:700,color:myN.length>0?T.red:T.green}}>{myN.length}</div>
              </div>
            </div>
            {myN.length>0&&(
              <GlassCard style={{padding:16,border:`1px solid ${T.red}44`}}>
                <div style={{fontSize:15,fontWeight:600,color:T.red,marginBottom:10}}>⚠ Latest Alert</div>
                <div style={{fontSize:15,color:T.text}}>{myN[myN.length-1]&&("⚠️ "+(myN[myN.length-1].text||myN[myN.length-1]))}</div>
              </GlassCard>
            )}
          </div>
        )}

        {/* ATTENDANCE TAB */}
        {activeTab==="attendance"&&(
          <div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:8}}>
              <h2 style={{fontSize:20,fontWeight:700,color:T.text,margin:0}}>Attendance</h2>
              <input type="month" value={vm} onChange={e=>setVm(e.target.value)} style={{background:T.surface2,border:`1px solid ${T.border}`,borderRadius:8,padding:"8px 12px",color:T.text,fontSize:15,outline:"none"}}/>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginBottom:20}}>
              {[["Present",p,T.green],["Absent",a,T.red],["Late",l,T.amber],["Attendance",pct+(pct!=="N/A"?"%":""),T.accent]].map(([lbl,v,c])=>(
                <div key={lbl} style={{background:T.surface,border:`1px solid ${T.border}`,borderRadius:10,padding:"12px 14px",textAlign:"center"}}>
                  <div style={{fontSize:13,color:T.textMuted,marginBottom:4}}>{lbl}</div>
                  <div style={{color:c,fontSize:22,fontWeight:700}}>{v}</div>
                </div>
              ))}
            </div>
            <GlassCard style={{padding:16}}>
              <div style={{
                display:"grid",
                gridTemplateColumns:"repeat(7,1fr)",
                gap:6,
                rowGap:4,
              }}>
                {["Su","Mo","Tu","We","Th","Fr","Sa"].map((d,i)=>(
                  <div key={i} style={{textAlign:"center",fontSize:13,fontWeight:700,color:i===0?T.red:T.textMuted,paddingBottom:6,borderBottom:`1px solid ${T.border}33`}}>{d}</div>
                ))}
                {Array((()=>{const[_y,_m]=vm.split("-").map(Number);return new Date(_y,_m-1,1).getDay();})()).fill(null).map((_,i)=><div key={`e${i}`}/>)}
                {mdays.map(d=>{
                  const h=isH(d);
                  const raw=att[d]?.[auth.studentId]||"";
                  const v=h?"H":raw;
                  const day=parseInt(d.split("-")[2]);
                  const isToday=d===td();
                  const bgColor=v?SBG[v]:isToday?T.amber+"33":"transparent";
                  return(
                    <div key={d} style={{
                      textAlign:"center",
                      padding:"7px 2px",
                      borderRadius:8,
                      background:bgColor,
                      border:isToday&&!v?`1px solid ${T.accent}55`:"1px solid transparent",
                      minHeight:40,
                      display:"flex",
                      flexDirection:"column",
                      alignItems:"center",
                      justifyContent:"center",
                      gap:2,
                    }}>
                      <span style={{
                        fontSize:15,
                        fontWeight:isToday?700:400,

  const[selStaff,setSelStaff]=useState(null);

    if(!window.confirm("Restore this student to active list?"))return;
    setLeftStudents(p=>p.filter(x=>x.id!==s.id));

  const restoreStaff=(s)=>{
    if(!window.confirm("Restore this staff to active list?"))return;
    setLeftStaff(p=>p.filter(x=>x.id!==s.id));

  const trashStudent=(s)=>{
    if(!window.confirm("Move to Trash? Will be deleted after 7 days."))return;
    setTrash(p=>[...p,{...s,_trashType:"leftStudent",_trashedAt:Date.now()}]);
    setLeftStudents(p=>p.filter(x=>x.id!==s.id));
    if(selStudent?.id===s.id)setSelStudent(null);

  const trashStaff=(s)=>{

    setTrash(p=>[...p,{...s,_trashType:"leftStaff",_trashedAt:Date.now()}]);

function TeachersList({staff,setStaff,leftStaff,setLeftStaff,trash,setTrash}) {

          <div style={{fontWeight:600,color:"#e67e00",marginBottom:12,fontSize:15}}>Edit Staff Details</div>

// ── TRASH ─────────────────────────────────────────────────────────────────────
function TrashTab({trash,setTrash,students,setStudents,staff,setStaff,leftStudents,setLeftStudents,leftStaff,setLeftStaff}) {
  const WEEK=7*24*60*60*1000;

  // Auto-delete items older than 7 days
  useEffect(()=>{
    const now=Date.now();
    setTrash(p=>p.filter(x=>(now-(x._trashedAt||0))<WEEK));
  },[]);

  const daysLeft=(item)=>Math.max(0,Math.ceil((WEEK-(Date.now()-(item._trashedAt||0)))/(24*60*60*1000)));

  const restore=(item)=>{
    if(!window.confirm("Restore this record?"))return;
    const{_trashType,_trashedAt,...clean}=item;
    if(_trashType==="student"||_trashType==="leftStudent"){
      if(_trashType==="leftStudent")setLeftStudents(p=>[...p,clean]);
      else setStudents(p=>[...p,clean]);
    } else if(_trashType==="staff"||_trashType==="leftStaff"){
      if(_trashType==="leftStaff")setLeftStaff(p=>[...p,clean]);
      else setStaff(p=>[...p,clean]);
    }
    setTrash(p=>p.filter(x=>x.id!==item.id||x._trashedAt!==item._trashedAt));
  };

  const deletePerm=(item)=>{
    if(!window.confirm("Permanently delete? This CANNOT be undone."))return;
    setTrash(p=>p.filter(x=>!(x.id===item.id&&x._trashedAt===item._trashedAt)));
  };

  const emptyTrash=()=>{
    if(!window.confirm("Permanently delete ALL trash items? This cannot be undone!"))return;
    setTrash([]);
  };

  const typeLabel=(t)=>({student:"Student",leftStudent:"Left Student",staff:"Staff",leftStaff:"Resigned Staff"}[t]||t);

  return(
    <div>
      <PageHeader title="🗑️ Trash" subtitle={`${trash.length} items · Auto-deleted after 7 days`} actions={
        trash.length>0&&<Btn onClick={emptyTrash} variant="danger">🗑 Empty Trash</Btn>
      }/>
      {trash.length===0
        ?<GlassCard style={{padding:40,textAlign:"center",color:T.textMuted}}>
            <div style={{fontSize:42,marginBottom:12}}>🗑️</div>
            <div style={{fontSize:18,fontWeight:600}}>Trash is empty</div>
            <div style={{fontSize:15,marginTop:4}}>Deleted items appear here for 7 days before being permanently removed</div>
          </GlassCard>
        :<GlassCard>
          <Tbl>
            <thead><tr><TH>Type</TH><TH>Name</TH><TH>Details</TH><TH>Deleted</TH><TH>Expires In</TH><TH>Actions</TH></tr></thead>
            <tbody>
              {trash.map((item,i)=>(
                <tr key={i}>
                  <TD><Badge color={item._trashType?.includes("student")?T.accent:T.amber}>{typeLabel(item._trashType)}</Badge></TD>
                  <TD style={{fontWeight:600}}>{item.name} {item.surname||""}</TD>
                  <TD style={{color:T.textMuted,fontSize:14}}>{item.studentId||item.employeeId||item.designation||"-"}</TD>
                  <TD style={{color:T.textMuted,fontSize:14,whiteSpace:"nowrap"}}>{new Date(item._trashedAt||0).toLocaleDateString()}</TD>
                  <TD>
                    <span style={{color:daysLeft(item)<=1?T.red:daysLeft(item)<=3?T.amber:T.green,fontWeight:600,fontSize:14}}>
                      {daysLeft(item)} day{daysLeft(item)!==1?"s":""} left
                    </span>
                  </TD>
                  <TD>
                    <div style={{display:"flex",gap:4}}>
                      <Btn onClick={()=>restore(item)} variant="success" sm>↩ Restore</Btn>
                      <Btn onClick={()=>deletePerm(item)} variant="danger" sm>✕ Delete</Btn>
                    </div>
                  </TD>
                </tr>
              ))}
            </tbody>
          </Tbl>
        </GlassCard>
      }
    </div>
  );
}


// ── STAFF LIST ────────────────────────────────────────────────────────────────
function StaffList({staff,setStaff,leftStaff,setLeftStaff,trash,setTrash,canAdd,canEdit,canDel}) {
  const[q,setQ]=useState("");
  const[markLeftId,setMarkLeftId]=useState(null);
  const[leftReason,setLeftReason]=useState("");
  const[editId,setEditId]=useState(null);
  const[editData,setEditData]=useState({});

  const active=(staff||[]).filter(s=>!s.leftDate);
  const filt=active.filter(s=>[s.name,s.surname,s.employeeId,s.designation,s.mobile,s.email].some(x=>x?.toLowerCase().includes(q.toLowerCase())));

  const markLeft=()=>{
    if(!leftReason.trim())return alert("Please enter a reason");
    const s=staff.find(x=>x.id===markLeftId);
    if(!s)return;
    setLeftStaff(p=>[...p,{...s,leftDate:td(),leftReason}]);
    setStaff(p=>p.filter(x=>x.id!==markLeftId));
    setMarkLeftId(null);setLeftReason("");
  };

  const saveEdit=()=>{
    setStaff(p=>p.map(s=>s.id===editId?{...s,...editData}:s));
    setEditId(null);setEditData({});
  };

  const expCSV=()=>{
    const rows=[["Name","Surname","Emp ID","Designation","Mobile 1","Mobile 2","Email","DOJ","Qualification","Experience","Aadhar","Address"],
      ...active.map(s=>[s.name,s.surname||"",s.employeeId||"",s.designation||"",s.mobile||"",s.mobile2||"",s.email||"",fD(s.dateOfJoining),s.qualification||"",s.experience||"",s.aadhar||"",s.address||""])];
    const csv=makeCSV(rows);
    const b=new Blob([csv],{type:"text/csv"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="staff.csv";a.click();
  };

  return(
    <div>
      <PageHeader title="Staff" subtitle={`${filt.length} active staff members`} actions={
        <>
          <Input placeholder="Search staff..." value={q} onChange={e=>setQ(e.target.value)} style={{width:220}}/>
          <Btn onClick={expCSV} variant="secondary">⬇ Export</Btn>
        </>
      }/>

      {/* Mark Left Confirm */}
      {markLeftId&&(
        <GlassCard style={{padding:16,marginBottom:16,border:`1px solid ${T.amber}44`}}>
          <div style={{fontWeight:700,color:T.amber,marginBottom:10,fontSize:15}}>REASON FOR LEAVING *</div>
          <Input value={leftReason} onChange={e=>setLeftReason(e.target.value)} fullWidth placeholder="Enter reason..."/>
          <div style={{display:"flex",gap:8,marginTop:10}}>
            <Btn onClick={markLeft} variant="danger">Confirm Left</Btn>
            <Btn onClick={()=>{setMarkLeftId(null);setLeftReason("");}} variant="secondary">Cancel</Btn>
          </div>
        </GlassCard>
      )}

      {/* Edit Form */}
      {editId&&(
        <GlassCard style={{padding:20,marginBottom:16,border:`1px solid ${T.green}44`}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
            <h3 style={{fontSize:16,fontWeight:700,color:T.green,margin:0}}>✏️ EDIT STAFF — {editData.name} {editData.surname||""}</h3>
            <Btn onClick={()=>{setEditId(null);setEditData({});}} variant="ghost" sm>✕</Btn>
          </div>
          <SectionDivider title="Basic Details"/>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:12,marginBottom:12}}>
            <Input label="First Name" value={editData.name||""} onChange={e=>setEditData(p=>({...p,name:e.target.value}))} fullWidth/>
            <Input label="Surname" value={editData.surname||""} onChange={e=>setEditData(p=>({...p,surname:e.target.value}))} fullWidth/>
            <Input label="Employee ID" value={editData.employeeId||""} onChange={e=>setEditData(p=>({...p,employeeId:e.target.value}))} fullWidth/>
            <Input label="Designation" value={editData.designation||""} onChange={e=>setEditData(p=>({...p,designation:e.target.value}))} fullWidth/>
            <Input label="Date of Joining" type="date" value={editData.dateOfJoining||""} onChange={e=>setEditData(p=>({...p,dateOfJoining:e.target.value}))} fullWidth/>
            <Input label="Qualification" value={editData.qualification||""} onChange={e=>setEditData(p=>({...p,qualification:e.target.value}))} fullWidth/>
            <Input label="Experience" value={editData.experience||""} onChange={e=>setEditData(p=>({...p,experience:e.target.value}))} fullWidth/>
            <Input label="Gross Salary (₹)" type="number" value={editData.grossSalary||""} onChange={e=>setEditData(p=>({...p,grossSalary:e.target.value}))} fullWidth/>
          </div>
          <SectionDivider title="Contact Details"/>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:12,marginBottom:12}}>
            <Input label="Mobile 1" value={editData.mobile||""} onChange={e=>setEditData(p=>({...p,mobile:e.target.value}))} fullWidth/>
            <Input label="Mobile 2" value={editData.mobile2||""} onChange={e=>setEditData(p=>({...p,mobile2:e.target.value}))} fullWidth/>
            <Input label="Email" value={editData.email||""} onChange={e=>setEditData(p=>({...p,email:e.target.value}))} fullWidth/>
            <Input label="Aadhar" value={editData.aadhar||""} onChange={e=>setEditData(p=>({...p,aadhar:e.target.value}))} fullWidth/>
            <Input label="Father's Name" value={editData.fatherName||""} onChange={e=>setEditData(p=>({...p,fatherName:e.target.value}))} fullWidth/>
            <Input label="Date of Birth" type="date" value={editData.dob||""} onChange={e=>setEditData(p=>({...p,dob:e.target.value}))} fullWidth/>
          </div>
          <Input label="Address" value={editData.address||""} onChange={e=>setEditData(p=>({...p,address:e.target.value}))} fullWidth/>
          <div style={{display:"flex",gap:8,marginTop:16}}>
            <Btn onClick={saveEdit}>💾 Save Changes</Btn>
            <Btn onClick={()=>{setEditId(null);setEditData({});}} variant="secondary">Cancel</Btn>
          </div>
        </GlassCard>
      )}

      <GlassCard>
        <Tbl>
          <thead><tr>
            <TH>Emp ID</TH><TH>Name</TH><TH>Designation</TH><TH>Mobile 1</TH><TH>Mobile 2</TH><TH>Email</TH><TH>Joined</TH><TH>Qualification</TH><TH>Actions</TH>
          </tr></thead>
          <tbody>
            {filt.length===0&&<tr><td colSpan={9} style={{padding:28,textAlign:"center",color:T.textMuted}}>No staff found</td></tr>}
            {filt.map(s=>(
              <tr key={s.id}>
                <TD><Badge>{s.employeeId||"-"}</Badge></TD>
                <TD><div style={{fontWeight:700}}>{s.name} {s.surname||""}</div><div style={{fontSize:13,color:T.textMuted}}>{s.aadhar?`Aadhar: ${s.aadhar}`:""}</div></TD>
                <TD>{s.designation||"-"}</TD>
                <TD>{s.mobile||"-"}</TD>
                <TD>{s.mobile2||"-"}</TD>
                <TD style={{fontSize:13,color:T.textMuted}}>{s.email||"-"}</TD>
                <TD style={{color:T.textMuted}}>{fD(s.dateOfJoining)}</TD>
                <TD style={{color:T.textMuted}}>{s.qualification||"-"}</TD>
                <TD>
                  <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
                    {canEdit&&<Btn onClick={()=>{setEditId(s.id);setEditData({...s});}} variant="ghost" sm>Edit</Btn>}
                    {canEdit&&<Btn onClick={()=>setMarkLeftId(s.id)} variant="danger" sm>Left</Btn>}
                  </div>
                </TD>
              </tr>
            ))}
          </tbody>
        </Tbl>
      </GlassCard>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
